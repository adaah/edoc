}

/* ---------- paginação ---------- */
function tccPage(inner, num, extraCls = ''){
  return { html:`<div class="page tcc-page ${extraCls}"><div class="tcc-in">${inner}</div>${num ? `<div class="pn fx">${num}</div>` : ''}</div>` };
}
function tccFlow(blocks, startIndex, host){
  // pagina uma lista de blocos de fluxo único; devolve [{blocks:[...]}], com páginas novas onde newPage
  const hs = measure(blocks, host);
  const measureOne = (cls, html) => { host.innerHTML = `<div class="blk ${cls}">${html}</div>`; const h = host.firstChild.getBoundingClientRect().height; host.innerHTML = ''; return h; };
  const pages = []; let cur = null, used = 0;
  const newPage = () => { cur = []; pages.push(cur); used = 0; };
  const queue = blocks.map((b, i) => ({ ...b, h: hs[i] }));
  for (let i = 0; i < queue.length; i++){
    const b = queue[i];
    if (!cur || (b.newPage && cur.length)) newPage();
    const room = T_H - used;
    if (b.para){
      if (b.h <= room){ cur.push(b); used += b.h; continue; }
      if (used > 0 && room < 72){ newPage(); i--; continue; }
      const words = b.para.raw.split(' '), off = b.para.off || 0;
      let lo = 1, hi = words.length - 1, best = 0;
      while (lo <= hi){
        const mid = (lo + hi) >> 1;
        const h = measureOne(b.cls, tccParaHTML(b.para.path, words.slice(0, mid).join(' '), `${off}:${off+mid}`, true, !off && !b.para.ni));
        if (h <= room){ best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      while (best > 0 && !balanced(words.slice(0, best).join(' '))) best--;
      if (best < 6){ if (used > 0){ newPage(); i--; continue; } cur.push(b); used += b.h; continue; }
      cur.push({ cls:b.cls, html: tccParaHTML(b.para.path, words.slice(0, best).join(' '), `${off}:${off+best}`, true, !off && !b.para.ni) });
      newPage();
      const tail = words.slice(best).join(' ');
      const th = tccParaHTML(b.para.path, tail, `${off+best}:${off+words.length}`, false, false);
      queue.splice(i+1, 0, { cls:b.cls, para:{ path:b.para.path, raw:tail, off: off+best, ni: b.para.ni }, html: th, h: measureOne(b.cls, th) });
      continue;
    }
    let need = b.h;
    if (b.keep && queue[i+1]) need += queue[i+1].para ? Math.min(queue[i+1].h, 72) : queue[i+1].h;
    if (used > 0 && used + need > T_H && !b.newPage) newPage();
    if (b.toc) b.toc.page = startIndex + pages.length - 1;
    cur.push(b); used += b.h;
  }
  return pages;
}
function tccPaginate(d){
  const host = $('#mTcc');
  const f = d.f, aut = tccAutores(d);
  const autList = d.f.autores.map((a, i) => ({ a: a.trim(), i })).filter(x => x.a);
  const autHTML = autList.length ? autList.map(x => V(`f.autores.${x.i}`, esc(x.a), 'plain')).join('<br>') : '<span class="ph">Nome do estudante</span>';
  const pages = [];
  // capa (não numerada)
  pages.push(tccPage(`<div class="capa">
      <div class="capa-top"><img src="${CEAAT_LOGO}" alt="" class="capa-logo"><div class="capa-esc">${V('f.escola', esc(f.escola), 'plain')}<br>${V('f.curso', esc(f.curso), 'plain')}</div></div>
      <div class="capa-aut">${autHTML}</div>
      <div class="capa-tit">${tccTituloHTML(d, true)}</div>
      <div class="capa-loc">${V('f.cidade', esc(f.cidade), 'plain')}<br>${V('f.ano', esc(f.ano), 'plain')}</div></div>`, 0, 'np'));
  // folha de rosto
  pages.push(tccPage(`<div class="rosto">
      <div class="rosto-aut">${autHTML}</div>
      <div class="rosto-tit">${tccTituloHTML(d, false)}</div>
      <div class="rosto-nat">${V('f.natureza', md(f.natureza), 'line')}</div>
      <div class="rosto-inst">${esc(f.escola)}<br>${esc(f.curso)}</div>
      ${f.orientador.trim() ? `<div class="rosto-ori">Orientador: ${V('f.orientador', esc(f.orientador), 'plain')}${f.coorientador.trim() ? `<br>Coorientador: ${V('f.coorientador', esc(f.coorientador), 'plain')}` : ''}</div>` : ''}
      <div class="capa-loc">${esc(f.cidade)}<br>${esc(f.ano)}</div></div>`, 0));
  // resumo e abstract
  const resumoBlocks = (key, kw, tit, kwLabel) => {
    const bl = [{ cls:'b-th1 ctr', newPage:true, keep:true, html: tit }];
    const ps = paras(d[key]).filter(p => p.trim());
    if (!ps.length) bl.push({ cls:'b-tp', html:'<p class="tp nofi"><span class="ph">(vazio)</span></p>' });
    ps.forEach((p, k) => bl.push({ cls:'b-tp', para:{ path:`${key}.p.${k}`, raw:p, ni:true }, html: tccParaHTML(`${key}.p.${k}`, p, null, false, false) }));
    bl.push({ cls:'b-tkw', html:`<b>${kwLabel}:</b> ${V(kw, d[kw].trim() ? md(d[kw]) : '<span class="ph">(vazio)</span>', 'line')}` });
    return bl;
  };
  [['resumo','palavras','RESUMO','Palavras-chave'], ['abstract','keywords','ABSTRACT','Keywords']].forEach(x => {
    tccFlow(resumoBlocks(...x), pages.length, host).forEach(pb => pages.push({ blocks: pb, num: 0 }));
  });
  // corpo (primeiro passo, para saber as páginas do sumário)
  const body = tccBodyBlocks(d);
  const tocEntries = body.filter(b => b.toc).map(b => b.toc);
  const tocRows = tocEntries.map(t => ({ cls:'b-toc' + (t.lvl === 1 ? ' l1' : '') + (t.lvl === 1 && !t.num ? ' nonum' : ''), t }));
  const tocHTML = (t, pg) => `<span class="toc-row" data-goto="${pg}" data-lvl="${t.lvl}" data-title="${esc((t.num ? t.num + ' ' : '') + t.txt)}"><span class="tn">${esc(t.num)}</span><span class="tt">${esc(t.txt)}</span><span class="dots"></span><span class="tpg">${pg}</span></span>`;
  const tocBlocks = [{ cls:'b-th1 ctr', newPage:true, keep:true, html:'SUMÁRIO' }, ...tocRows.map(r => ({ cls:r.cls, html: tocHTML(r.t, '00') }))];
  const tocPages = tccFlow(tocBlocks, pages.length, host);
  const bodyStart = pages.length + tocPages.length;
  const bodyPages = tccFlow(body, bodyStart, host);
  // sumário com os números reais
  const tocFinal = [{ cls:'b-th1 ctr', newPage:true, keep:true, html:'SUMÁRIO' }, ...tocRows.map(r => ({ cls:r.cls, html: tocHTML(r.t, (r.t.page ?? 0) + 1 - 1) }))];
  tccFlow(tocFinal, pages.length, host).forEach(pb => pages.push({ blocks: pb, num: 0 }));
  bodyPages.forEach(pb => pages.push({ blocks: pb, num: 1 }));
  // monta HTML; número de página = posição contada a partir da capa, visível só no corpo
  return pages.map((p, i) => p.html !== undefined ? p : tccPage(p.blocks.map(b => `<div class="blk ${b.cls}">${b.html}</div>`).join(''), p.num ? i : 0));
}

    <div class="add-blocks"><span class="lbl-sm">Acrescentar:</span>
      <button class="btn small" data-act="blk-add" data-t="p">Texto</button>
      ${c.kind === 'cap' ? `<button class="btn small" data-act="blk-add" data-t="h2">Seção</button><button class="btn small" data-act="blk-add" data-t="h3">Subseção</button>` : ''}
      <button class="btn small" data-act="blk-add" data-t="list">Lista</button>
      <button class="btn small" data-act="blk-add" data-t="fig">Figura</button>
      <button class="btn small" data-act="blk-add" data-t="tab">Tabela</button>
    </div>
  </div>`;
}
function blockNumbers(ci){
  // números de seção para mostrar no formulário
  const c = doc.caps[ci], o = tccOutline(doc).find(x => x.ci === ci);
  let s2 = 0, s3 = 0; const nums = {};
  c.blocos.forEach((b, bi) => { if (c.kind !== 'cap') return; if (b.t === 'h2'){ s2++; s3 = 0; nums[bi] = `${o.label}.${s2}`; } if (b.t === 'h3'){ s3++; nums[bi] = `${o.label}.${s2}.${s3}`; } });
  return nums;
}
function renderBlock(ci, bi, b, len){
  const base = `c.${ci}.b.${bi}`;
  const nums = blockNumbers(ci);
  const names = { p:'Texto', h2:'Seção', h3:'Subseção', list:'Lista', fig:'Figura', tab:'Tabela' };
  const tools = `<span class="sp"></span>
    <button class="icon-btn" data-act="blk-up" data-bi="${bi}" ${bi===0?'disabled':''} aria-label="Subir">${ICON.up}</button>
    <button class="icon-btn" data-act="blk-down" data-bi="${bi}" ${bi===len-1?'disabled':''} aria-label="Descer">${ICON.down}</button>
    <button class="icon-btn danger" data-act="blk-del" data-bi="${bi}" aria-label="Remover">${ICON.del}</button>`;
  let body = '';
  if (b.t === 'p') body = RT(`${base}.text`, 'para', b.text, 'Escreva o texto. Enter começa um novo parágrafo.', 'Texto');
  if (b.t === 'h2' || b.t === 'h3') body = `<input class="inp hd-${b.t}" data-bind="${base}.text" value="${esc(b.text)}" placeholder="Título da ${names[b.t].toLowerCase()}" aria-label="Título da ${names[b.t].toLowerCase()}">`;
  if (b.t === 'list') body = `<div class="alts">${b.items.map((it, k) => `<div class="alt-row"><span>•</span>${RT(`${base}.i.${k}`, 'line', it, 'Item da lista', 'Item '+(k+1))}</div>`).join('')}</div>
      <div class="alt-ctl"><button class="btn small" data-act="li-add" data-bi="${bi}">Adicionar item</button>${b.items.length > 1 ? `<button class="btn small ghost" data-act="li-rem" data-bi="${bi}">Remover último item</button>` : ''}</div>`;
  if (b.t === 'fig') body = `<div class="grid" style="gap:10px 14px">
      <div class="f w6"><label>Título da figura (sai em cima)</label>${RT(`${base}.cap`, 'line', b.cap || '', 'Ex.: Tela inicial do sistema', 'Título da figura')}</div>
      <div class="f w6">${b.src ? `<div class="q-img"><img src="${b.src}" alt="Figura"><button class="btn small" data-act="fig-img" data-bi="${bi}">Trocar imagem</button></div>` : `<button class="btn small" data-act="fig-img" data-bi="${bi}">Escolher imagem</button>`}</div>
      <div class="f w6"><label>Fonte (sai embaixo)</label>${RT(`${base}.fonte`, 'line', b.fonte || '', 'Ex.: Elaborado pelos autores (2026).', 'Fonte da figura')}</div></div>`;
  if (b.t === 'tab') body = `<div class="grid" style="gap:10px 14px">
      <div class="f w6"><label>Título da tabela (sai em cima)</label>${RT(`${base}.cap`, 'line', b.cap || '', 'Ex.: Comparação de dados', 'Título da tabela')}</div>
      <div class="f w6"><div class="tab-ed"><table>${b.rows.map((r, ri) => `<tr>${r.map((x, cj) => `<td><input class="inp${ri===0?' th':''}" data-bind="${base}.cell.${ri}.${cj}" value="${esc(x)}" aria-label="Linha ${ri+1}, coluna ${cj+1}"></td>`).join('')}</tr>`).join('')}</table></div>
        <div class="alt-ctl"><button class="btn small" data-act="tr-add" data-bi="${bi}">+ Linha</button><button class="btn small" data-act="tc-add" data-bi="${bi}">+ Coluna</button>
        ${b.rows.length > 2 ? `<button class="btn small ghost" data-act="tr-rem" data-bi="${bi}">− Linha</button>` : ''}${b.rows[0].length > 1 ? `<button class="btn small ghost" data-act="tc-rem" data-bi="${bi}">− Coluna</button>` : ''}
        <span class="muted" style="font-size:13px">A primeira linha é o cabeçalho.</span></div></div>
      <div class="f w6"><label>Fonte (sai embaixo)</label>${RT(`${base}.fonte`, 'line', b.fonte || '', 'Ex.: Elaborado pelos autores (2026).', 'Fonte da tabela')}</div></div>`;
  return `<div class="q blk-ed blk-${b.t}" id="tb-${ci}-${bi}">
    ${b.hint ? tccHint(b.hint) : ''}
    <div class="q-head"><b>${nums[bi] ? nums[bi] + ' ' : ''}${names[b.t]}</b>${tools}</div>${body}</div>`;
}
function tccSetBind(path, v){
  const a = path.split('.');
  if (a[0] === 'f'){ if (a[1] === 'autores') doc.f.autores[+a[2]] = v; else doc.f[a[1]] = v; return; }
  if (['resumo','abstract','palavras','keywords'].includes(a[0])){ doc[a[0]] = v; return; }
  if (a[0] === 'ref'){ const r = doc.refs[+a[1]]; if (a[2] === 'livre' && r.tipo !== 'outro'){ r.tipo = 'outro'; } r[a[2]] = v; return; }
  if (a[0] === 'c'){
    const c = doc.caps[+a[1]];
    if (a[2] === 'titulo'){ c.titulo = v; return; }
    const b = c.blocos[+a[3]];
    if (a[4] === 'i') b.items[+a[5]] = v;
    else if (a[4] === 'cell') b.rows[+a[5]][+a[6]] = v;
    else b[a[4]] = v;
  }
}
function onTccInput(e){
  const el = e.target.closest ? e.target.closest('[data-bind]') : e.target;
  if (!el || !el.dataset.bind) return;
  let v;
  if (el.classList.contains('rt')){ v = htmlToMd(el); if (el.dataset.kind !== 'para') v = v.replace(/\s*\n+\s*/g, ' '); }
  else v = el.value;
  tccSetBind(el.dataset.bind, v); touch();
  if (el.dataset.bind.startsWith('ref.')){ const i = +el.dataset.bind.split('.')[1], pv = $(`#rf-${i} .ref-prev`); if (pv){ const m = refMd(doc.refs[i]); pv.innerHTML = m ? md(m) : '<span class="muted">A referência no formato ABNT aparece aqui.</span>'; } }
}
function rerenderCaps(){ $('#caps').innerHTML = renderCaps(); }
function onTccClick(e){
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i, bi = +b.dataset.bi;
  const c = doc.caps[activeCap], bl = c?.blocos;
  const swap = (arr, x, y) => { [arr[x], arr[y]] = [arr[y], arr[x]]; };
  switch (act){
    case 'review': setView('review'); return;
    case 'aut-add': doc.f.autores.push(''); touch(); keepScroll(renderTccForm); $$('#t-id .prof-row .inp').at(-1)?.focus(); return;
    case 'aut-del': doc.f.autores.splice(i, 1); if (!doc.f.autores.length) doc.f.autores = ['']; touch(); keepScroll(renderTccForm); return;
    case 'refmode': { const m = b.dataset.m; if (doc.refMode === m || (m === 'campos' && !doc.refMode)) return; doc.refMode = m; touch(); keepScroll(renderTccForm); return; }
    case 'ref-bulk': openRefBulk(); return;
    case 'tcc-import': openTccImport(b.dataset.tab || 'paste'); return;
    case 'ref-add': doc.refs.push(novaRef(b.dataset.tipo || 'livro')); touch(); $('#refList').innerHTML = renderRefs(); $(`#rf-${doc.refs.length-1} .inp[data-bind], #rf-${doc.refs.length-1} .rt`)?.focus(); return;
    case 'ref-del': {
      const r = doc.refs[i], usada = JSON.stringify(doc.caps).includes(':' + r.id + '}');
      if (usada && !confirm('Esta referência é citada no texto. Se remover, as citações dela vão aparecer como "(referência removida)". Remover mesmo assim?')) return;
      doc.refs.splice(i, 1); if (!doc.refs.length) doc.refs = [novaRef()]; touch(); $('#refList').innerHTML = renderRefs(); return;
    }
    case 'cap-tab': activeCap = +b.dataset.ci; keepScroll(rerenderCaps); return;
    case 'cap-add': {
      const kind = b.dataset.kind;
      const nc = { id: uid(), kind, titulo:'', hint: kind === 'apendice' ? OR.apendice : kind === 'anexo' ? OR.anexo : '', blocos:[ nb('p',{text:''}) ] };
      // capítulo novo entra antes de apêndices/anexos
      if (kind === 'cap'){ const lastCap = doc.caps.map(x => x.kind).lastIndexOf('cap'); doc.caps.splice(lastCap + 1, 0, nc); }
      else doc.caps.push(nc);
      activeCap = doc.caps.indexOf(nc); touch(); keepScroll(rerenderCaps); $('#caps .sec-head .inp')?.focus(); return;
    }
    case 'cap-del': {
      const has = c.blocos.some(x => (x.text||'').trim() || (x.items||[]).some(y => y.trim()) || x.src || (x.rows||[]).some(r => r.some(y => y.trim())));
      if (has && !confirm('Remover esta parte e todo o conteúdo dela?')) return;
      doc.caps.splice(activeCap, 1); activeCap = 0; touch(); keepScroll(rerenderCaps); return;
    }
    case 'cap-up': case 'cap-down': {
      const same = doc.caps.map((x, k) => x.kind === c.kind ? k : -1).filter(k => k >= 0);
      const p = same.indexOf(activeCap), q = same[p + (act === 'cap-up' ? -1 : 1)];
      if (q === undefined) return;
      swap(doc.caps, activeCap, q); activeCap = q; touch(); keepScroll(rerenderCaps); return;
    }
    case 'blk-add': {
      const t = b.dataset.t;
      const nbk = t === 'p' ? nb('p',{text:''}) : t === 'h2' || t === 'h3' ? nb(t,{text:''}) : t === 'list' ? nb('list',{items:['']}) : t === 'fig' ? nb('fig',{cap:'', fonte:'', src:null}) : nb('tab',{cap:'', fonte:'', rows:[['',''],['','']]});
      bl.push(nbk); touch(); keepScroll(rerenderCaps);
      $(`#tb-${activeCap}-${bl.length-1} .rt, #tb-${activeCap}-${bl.length-1} .inp`)?.focus(); return;
    }
    case 'blk-del': {
      const x = bl[bi];
      const has = (x.text||'').trim() || (x.items||[]).some(y => y.trim()) || x.src || (x.rows||[]).some(r => r.some(y => y.trim()));
      if (has && !confirm('Remover este bloco?')) return;
      bl.splice(bi, 1); touch(); keepScroll(rerenderCaps); return;
    }
    case 'blk-up': swap(bl, bi, bi-1); touch(); keepScroll(rerenderCaps); return;
    case 'blk-down': swap(bl, bi, bi+1); touch(); keepScroll(rerenderCaps); return;
    case 'li-add': bl[bi].items.push(''); touch(); keepScroll(rerenderCaps); $$(`#tb-${activeCap}-${bi} .rt`).at(-1)?.focus(); return;
    case 'li-rem': bl[bi].items.pop(); touch(); keepScroll(rerenderCaps); return;
    case 'tr-add': bl[bi].rows.push(bl[bi].rows[0].map(() => '')); touch(); keepScroll(rerenderCaps); return;
    case 'tc-add': bl[bi].rows.forEach(r => r.push('')); touch(); keepScroll(rerenderCaps); return;
    case 'tr-rem': bl[bi].rows.pop(); touch(); keepScroll(rerenderCaps); return;
    case 'tc-rem': bl[bi].rows.forEach(r => r.pop()); touch(); keepScroll(rerenderCaps); return;
    case 'fig-img': pickFigure(activeCap, bi); return;
  }
}
function pickFigure(ci, bi){
  const inp = $('#imgInput'); inp.value = '';
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, 1400 / im.naturalWidth), cv = document.createElement('canvas');
      cv.width = Math.round(im.naturalWidth*s); cv.height = Math.round(im.naturalHeight*s);
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(im,0,0,cv.width,cv.height);
      Object.assign(doc.caps[ci].blocos[bi], { src: cv.toDataURL('image/jpeg', .86), w: cv.width, h: cv.height });
      touch(); keepScroll(rerenderCaps);
    }; im.onerror = () => toast('Não consegui abrir essa imagem. Tente um arquivo PNG ou JPG.'); im.src = r.result; };
    r.readAsDataURL(file);
  };
  inp.click();
}

/* ---------- revisão ---------- */
function tccIssues(d){
  const out = [];
  if (!d.f.titulo.trim()) out.push({ msg:'O trabalho ainda não tem título.', go:'form:#t-tit' });
  if (!tccAutores(d).length) out.push({ msg:'Nenhum estudante informado.', go:'form:#t-id' });
  if (!d.f.orientador.trim()) out.push({ msg:'Orientador(a) não informado.', go:'form:#t-ori' });
  if (!d.resumo.trim()) out.push({ msg:'O resumo está vazio.', go:'form:#t-res' });
  if (!d.abstract.trim()) out.push({ msg:'O abstract está vazio.', go:'form:#t-res' });
  if (d.resumo.trim()){ const n = plainOf(d.palavras).split(/[.;]/).map(x => x.trim()).filter(Boolean).length; if (n < 3) out.push({ msg:'Use de 3 a 5 palavras-chave, separadas por ponto.', go:'form:#t-res' }); }
  tccOutline(d).forEach(o => {
    const vazio = !o.c.blocos.some(b => (b.text||'').trim() || (b.items||[]).some(y => y.trim()) || b.src || (b.rows||[]).some(r => r.some(y => y.trim())));
    if (vazio) out.push({ msg:`${o.titulo}: sem conteúdo.`, go:`cap:${o.ci}` });
    else o.c.blocos.forEach(b => { if (b.t === 'p' && !b.text.trim()) out.push({ msg:`${o.titulo}: tem um bloco de texto vazio (não sai no PDF).`, go:`cap:${o.ci}` }); });
  });
  if (!tccRefs(d).length) out.push({ msg:'Nenhuma referência cadastrada.', go:'form:#t-refs' });
  const txt = JSON.stringify(d.caps);
  const ids = [...txt.matchAll(/\{(?:cite|citeonline):([\w-]+)\}/g)].map(m => m[1]);
  if (ids.some(id => !d.refs.some(r => r.id === id))) out.push({ msg:'Há citação de uma referência que foi removida.', go:'form:#t-caps' });
  d.refs.forEach((r, i) => { if (r.tipo !== 'outro' && refMd(r) && (!r.autores.trim() || !r.titulo.trim() || !r.ano.trim())) out.push({ msg:`Referência ${i+1}: falta autor, título ou ano.`, go:`form:#rf-${i}` }); });
  const plainAll = plainOf(JSON.stringify(d.caps)).toUpperCase();
  const citadaAMao = r => { const m = citeText(r, 'fim').match(/^\((.+), ([^,]+)\)$/); if (!m) return false; const first = m[1].split(/;| ET AL\./i)[0].trim().toUpperCase(); return first.length > 1 && plainAll.includes(first) && plainAll.includes(m[2]); };
  const naoCitadas = d.refs.filter(r => refMd(r) && !ids.includes(r.id) && !citadaAMao(r)).length;
  if (naoCitadas) out.push({ msg:`${naoCitadas} ${naoCitadas === 1 ? 'referência não é citada' : 'referências não são citadas'} no texto. Pela ABNT, toda referência listada deve aparecer no texto.`, go:'form:#t-refs' });
  return out;
}
function tccStats(d){ return [[tccOutline(d).filter(o => o.c.kind === 'cap').length, 'capítulos'], [tccRefs(d).length, 'referências']]; }
function tccDocName(d){ return d.f.titulo.trim() ? `TCC – ${d.f.titulo.trim()}` : 'TCC sem título'; }

function crumbsFor(d){ const t = TEMPLATES[d.templateId]; nav = { school: t.school, area: t.area }; return crumbsHTML(t.nome); }

if (EDICAO !== 'aluno') delete TEMPLATES[TCC_ID];

  document.title = 'EDOC - Aluno · Modelos de trabalhos escolares';
  const bn = $('#goHome .brand-name'); bn.insertAdjacentHTML('afterend', '<span class="brand-ed">Aluno</span>');
  $('#goHome').setAttribute('aria-label', 'EDOC - Aluno: voltar ao início');
}

/* ---------- modo claro / escuro ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const b = $('#themeBtn'), next = t === 'dark' ? 'claro' : 'escuro';
  b.setAttribute('aria-label', `Mudar para o modo ${next}`); b.title = `Mudar para o modo ${next}`;
  $('.tlbl', b).textContent = t === 'dark' ? 'Claro' : 'Escuro';
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
$('#themeBtn').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('edoc.tema', t); } catch(e){}
};

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  $('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4200);
}

})();
