  $('#impOk', m).onclick = () => {
    const mode = $('input[name=impMode]:checked', m).value;
    const secs = parsed.sections.map(s => ({ id:uid(), name:s.name, questions: s.questions.map(q => ({ id:uid(), text:q.text, alts:q.alts.slice(), n: Math.max(2, q.alts.length), img:null })) }));
    // decide o número de alternativas da prova
    const existentes = mode === 'append' ? allQuestions(doc).filter(q => q.text.trim() || q.alts.some(a => a.trim())).map(q => nAltOf(q)) : [];
    const novas = secs.flatMap(s => s.questions.map(q => q.n));
    const todos = new Set([...existentes, ...novas]);
    if (mode === 'append' && !isCustom(doc)) allQuestions(doc).forEach(q => { q.n = doc.f.nAlt; });
    if (todos.size === 1 && (novas[0] === 4 || novas[0] === 5)) doc.f.nAlt = novas[0];
    else doc.f.nAlt = 'custom';
    if (mode === 'replace'){ doc.sections = secs; activeSec = 0; }
    else {
      const last = doc.sections[doc.sections.length-1];
      if (secs.length && last && !secs[0].name && !last.questions.some(q=>q.text.trim())) last.questions = secs.shift().questions;
      doc.sections.push(...secs);
      doc.sections = doc.sections.filter(s => s.questions.length || s.name);
    }
    allQuestions(doc).forEach(q => { const k = nAltOf(q); while (q.alts.length < k) q.alts.push(''); });
    if (!profText(doc) && parsed.professores) doc.f.profs = splitProfs(parsed.professores);
    if (!doc.f.area && parsed.area) doc.f.area = parsed.area;
    touch(); close(); keepScroll(renderForm);
    toast(`${allQuestions(doc).length} questões na prova agora.`);
    $('#p-q')?.scrollIntoView();
  };
  showTab(tab || 'paste');
}

/* ---------- REVIEW ---------- */
function issues(d){
  const out = [];
  if (!allQuestions(d).length) out.push({ msg:'A prova ainda não tem questões.', go:'form:#p-q' });
  if (d.sections.length > 1) d.sections.forEach((s,si) => { if (!s.name.trim() && s.questions.length) out.push({ msg:`Uma disciplina está sem nome.`, go:`sec:${si}` }); });
  let n = 0;
  d.sections.forEach((s, si) => s.questions.forEach((q, qi) => {
    n++;
    if (!q.text.trim()) out.push({ msg:`Questão ${pad2(n)}: enunciado vazio.`, go:`q:${si}.${qi}` });
    const vazias = Array.from({length: nAltOf(q, d)}, (_,k) => (q.alts[k]||'').trim() ? null : LETRAS[k]).filter(Boolean);
    if (vazias.length) out.push({ msg:`Questão ${pad2(n)}: alternativa ${vazias.join(', ')} vazia.`, go:`q:${si}.${qi}` });
  }));
  return out;
}
let currentPages = [];
function renderReview(){
  app.innerHTML = `
  <div class="review-layout">
    <div class="desk"><div class="pages paper reviewing ${showMarks?'':'nomarks'}" id="pages"></div></div>
    <aside class="side"><div class="side-sticky" id="side"></div></aside>
  </div>`;
  app.onclick = null; app.oninput = null; app.onchange = null; app.onkeydown = null; app.onpaste = null;
  layoutPages();
  renderSide();
  bindEditing();
  window.addEventListener('resize', onResize);
}
let resizeT;
function onResize(){ if (view !== 'review') return window.removeEventListener('resize', onResize); clearTimeout(resizeT); resizeT = setTimeout(scalePages, 80); }
function layoutPages(){
  currentPages = paginate(doc);
  const host = $('#pages');
  host.innerHTML = '';
  const tmp = document.createElement('div'); tmp.innerHTML = pagesHTML(currentPages);
  Array.from(tmp.children).forEach(p => { const s = document.createElement('div'); s.className = 'page-slot'; s.appendChild(p); host.appendChild(s); });
  $$('.v', host).forEach(el => {
    el.setAttribute('contenteditable', 'true'); el.spellcheck = true; el.setAttribute('role','textbox');
    if (el.dataset.kind !== 'plain') el.setAttribute('data-rich', '');
  });
  $$('.fx', host).forEach(el => el.title = 'Parte fixa do modelo');
  $$('.vv', host).forEach(el => el.title = 'Marcado por você. Altere no formulário.');
  scalePages();
}
function scalePages(){
  const host = $('#pages'); if (!host) return;
  const avail = host.parentElement.clientWidth - 40;
  const s = Math.min(1, avail / 794);
  $$('.page-slot', host).forEach(slot => {
    slot.style.width = (794*s) + 'px'; slot.style.height = (1123*s) + 'px';
    slot.firstChild.style.transform = `scale(${s})`;
  });
}
function renderSide(){
  const list = issues(doc);
  const nq = allQuestions(doc).length;
  const nd = doc.sections.filter(s=>s.questions.length).length;
  $('#side').innerHTML = `
    <div><h2>Versão final</h2><p style="margin-top:6px">Assim a prova vai sair. Clique em qualquer trecho marcado para corrigir direto na página; selecione um trecho para destacar com <b>N</b>, <i>I</i> ou <u>S</u>.</p></div>
    <div class="legend">
      <div><span class="sw var"></span>Conteúdo seu</div>
      <div><span class="sw"></span>Parte fixa do modelo</div>
      <label class="chk"><input type="checkbox" id="marks" ${showMarks?'checked':''}> Mostrar marcações</label>
    </div>
    <div class="stats"><div><b>${currentPages.length}</b>páginas</div><div><b>${nq}</b>questões</div><div><b>${nd}</b>${nd===1?'disciplina':'disciplinas'}</div></div>
    <div>
      ${list.length ? `<p style="margin-bottom:8px;color:var(--ink);font-weight:700">Vale conferir (${list.length})</p><ul class="issues">${list.map(x => `<li><button data-go="${esc(x.go)}">${esc(x.msg)}</button></li>`).join('')}</ul>`
                    : `<div class="all-good">${ICON.check} Nenhum campo vazio encontrado</div>`}
    </div>
    <button class="btn" id="backEdit">Voltar ao formulário</button>
    <div class="confirm">
      <label class="chk"><input type="checkbox" id="okChk" ${confirmed?'checked':''}> Conferi a prova e está tudo certo</label>
      <button class="btn primary" id="btnPdf" ${confirmed?'':'disabled'}>Baixar PDF</button>
      <div class="progress hide" id="prog"><i></i></div>
      <span class="dl-note" id="dlNote">O PDF só é gerado depois da confirmação. Se mudar algo, confirme de novo.</span>
    </div>`;
  $('#marks').onchange = e => { showMarks = e.target.checked; $('#pages').classList.toggle('nomarks', !showMarks); };
  $('#backEdit').onclick = () => setView('form');
  $('#okChk').onchange = e => { confirmed = e.target.checked; $('#btnPdf').disabled = !confirmed; syncSteps(); };
  $('#btnPdf').onclick = exportPDF;
  $$('.issues button').forEach(b => b.onclick = () => goTo(b.dataset.go));
}
function goTo(go){
  if (go.startsWith('sec:')){ activeSec = +go.slice(4); setView('form'); $('#p-q')?.scrollIntoView(); $('.sec-head .inp')?.focus(); return; }
  if (go.startsWith('form:')){ setView('form'); const el = $(go.slice(5)); if (el){ el.scrollIntoView({block:'center'}); if (el.focus) el.focus(); } return; }
  if (go.startsWith('q:')){
    const el = $(`#pages .blk[data-q="${go.slice(2)}"]`);
    if (el){ el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
}
function bindEditing(){
  const host = $('#pages');
  host.addEventListener('focusin', e => {
    const el = e.target.closest('.v'); if (!el) return;
    const raw = getRaw(el.dataset.path, el.dataset.frag);
    if (el.dataset.kind === 'plain') el.textContent = raw;
    else el.innerHTML = md(raw, 'edit');
  });
  host.addEventListener('focusout', e => {
    const el = e.target.closest('.v'); if (!el) return;
    const path = el.dataset.path, frag = el.dataset.frag, kind = el.dataset.kind;
    let v = kind === 'plain' ? el.innerText.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim() : htmlToMd(el);
    if (kind === 'line') v = v.replace(/\s*\n+\s*/g,' ');
    if (v !== getRaw(path, frag).trim()){ setRaw(path, v, frag); touch(); dirtyLayout = true; }
    el.innerHTML = displayFor(path, getRaw(path, frag));
    setTimeout(maybeRelayout, 60);
  });
  host.addEventListener('keydown', e => {
    const el = e.target.closest('.v'); if (!el) return;
    if (e.key === 'Escape'){ el.innerHTML = md(getRaw(el.dataset.path, el.dataset.frag), 'edit'); el.blur(); }
    else if (e.key === 'Enter' && el.dataset.kind !== 'para'){ e.preventDefault(); el.blur(); }
  });
  host.addEventListener('paste', e => { const el = e.target.closest('.v'); if (el) richPaste(e, el.dataset.kind); });
}
let dirtyLayout = false;
function maybeRelayout(){
  if (!dirtyLayout || view !== 'review') return;
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#pages .v')) return;
  dirtyLayout = false;
  const y = window.scrollY;
  layoutPages(); renderSide();
  window.scrollTo(0, y);
}

/* ---------- PDF ---------- */
function slug(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80) || 'prova'; }
let downloadsP = null;
function getDownloads(){
  if (!downloadsP) downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return downloadsP;
}
async function exportPDF(){
  const btn = $('#btnPdf'), prog = $('#prog'), note = $('#dlNote');
  if (!window.html2canvas || !window.jspdf){ note.textContent = 'As bibliotecas do PDF não carregaram. Abrindo a impressão: escolha "Salvar como PDF".'; printFallback(); return; }
  btn.disabled = true; prog.classList.remove('hide');
  try {
    await document.fonts.ready;
    const root = $('#exportRoot');
    root.innerHTML = pagesHTML(paginate(doc));
    const pages = $$('.page', root);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait', compress:true });
    for (let i = 0; i < pages.length; i++){
      btn.textContent = `Gerando página ${i+1} de ${pages.length}…`;
      $('i', prog).style.width = `${Math.round(i/pages.length*100)}%`;
      const canvas = await html2canvas(pages[i], { scale: 2.4, backgroundColor:'#ffffff', logging:false, useCORS:true, windowWidth: 900 });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', .93), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    }
    $('i', prog).style.width = '100%';
    root.innerHTML = '';
    const blob = pdf.output('blob');
    const filename = slug(docName(doc)) + '.pdf';
    const dl = await getDownloads();
    if (dl){
      btn.textContent = 'Confirme o download…';
      try { await dl.save({ filename, data: blob }); note.textContent = 'PDF baixado. Se precisar mudar algo, edite e baixe de novo.'; }
      catch(err){
        if (err && err.code === 'declined') note.textContent = 'Download cancelado. É só clicar em Baixar PDF de novo.';
        else if (err && err.code === 'rate_limited') note.textContent = 'Já existe um download aguardando confirmação.';
        else { note.textContent = 'O download direto não está disponível aqui. Abrindo a impressão: escolha "Salvar como PDF".'; printFallback(); }
      }
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 20000);
      note.innerHTML = 'Se o download não começou, <button class="btn small" id="prt">imprima e salve como PDF</button>.';
      $('#prt')?.addEventListener('click', printFallback);
    }
  } catch(err){
    console.error(err);
    note.textContent = 'Não consegui gerar o PDF aqui. Abrindo a impressão: escolha "Salvar como PDF".';
    printFallback();
  } finally {
    btn.disabled = !confirmed; btn.textContent = 'Baixar PDF';
    setTimeout(() => prog.classList.add('hide'), 800);
  }
}
function printFallback(){
  const r = $('#printRoot');
  r.innerHTML = pagesHTML(paginate(doc));
  try { window.print(); } catch(e) {}
  setTimeout(() => { r.innerHTML = ''; }, 1000);
}

/* ---------- modo claro / escuro ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const b = $('#themeBtn'), next = t === 'dark' ? 'claro' : 'escuro';
  b.setAttribute('aria-label', `Mudar para o modo ${next}`); b.title = `Mudar para o modo ${next}`;
  $('.tlbl', b).textContent = t === 'dark' ? 'Claro' : 'Escuro';
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
$('#themeBtn').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('edoc.tema', t); } catch(e){}
};

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  $('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4200);
}

/* ---------- início ---------- */
loadStore();
(async () => {
  try { await Promise.all([document.fonts.load('13px Arimo'), document.fonts.load('bold 13px Arimo'), document.fonts.load('italic 13px Arimo')]); } catch(e){}
  setView('home');
})();
getDownloads();

</script>
