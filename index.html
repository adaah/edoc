<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  (function(){ var t = 'light'; try { t = localStorage.getItem('edoc.tema') || 'light'; } catch(e){}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<title>EDOC — Biblioteca de templates de documentos e recursos para a escola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F7F7; --ink:#171717; --muted:#5C6062;
  --line:#E2E5E5; --accent:#297971; --accent-ink:#FFFFFF; --accent-soft:#E6F1EF; --accent-hover:#21655E;
  --amber:#F59702; --amber-soft:#FEF0D9; --mark:rgba(245,151,2,.45);
  --danger:#B3261E; --ok:#297971; --desk:#EEF1F0;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Montserrat", "Inter", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121414; --surface:#1A1D1D; --surface-2:#222626; --ink:#F2F2F2; --muted:#A3AAA9;
    --line:#313737; --accent:#5DB3A9; --accent-ink:#0B1F1D; --accent-soft:#1D3835; --accent-hover:#74C2B9;
    --amber:#F59702; --amber-soft:#3A2A10; --mark:rgba(245,151,2,.45);
    --danger:#FF8A80; --ok:#5DB3A9; --desk:#0C0E0E;
  }
}
:root[data-theme="dark"]{
  --bg:#121414; --surface:#1A1D1D; --surface-2:#222626; --ink:#F2F2F2; --muted:#A3AAA9;
  --line:#313737; --accent:#5DB3A9; --accent-ink:#0B1F1D; --accent-soft:#1D3835; --accent-hover:#74C2B9;
  --amber:#F59702; --amber-soft:#3A2A10; --mark:rgba(245,151,2,.45);
  --danger:#FF8A80; --ok:#5DB3A9; --desk:#0C0E0E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand .logo{width:30px;height:auto;display:block}
.brand-name{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;color:var(--ink)}
.steps{display:flex;gap:4px;margin-left:auto;margin-right:auto;list-style:none;padding:0;margin-top:0;margin-bottom:0}
.steps li{display:flex}
.steps button{font-family:var(--display);font-weight:500;border:0;background:none;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:15px}
.steps button .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:700}
.steps button[aria-current="step"]{color:var(--ink);background:var(--accent-soft)}
.steps button[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button.done .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps button:disabled{cursor:default;opacity:.55}
.saved{font-size:13px;color:var(--muted);white-space:nowrap}
.theme-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--display);font-weight:500;font-size:14px;flex:none}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.steps:not(.hide) ~ .theme-btn{margin-left:12px}
.theme-btn .ic-sun{display:none}
:root[data-theme="dark"] .theme-btn .ic-sun{display:block}
:root[data-theme="dark"] .theme-btn .ic-moon{display:none}
:root[data-theme="dark"] .rtbar{box-shadow:0 6px 20px rgba(0,0,0,.5)}
:root[data-theme="dark"] .hdr-prev{border-color:var(--line)}
@media (max-width:720px){.steps .lbl{display:none}.saved{display:none}.top-in{padding:8px 14px}.theme-btn .tlbl{display:none}.theme-btn{padding:0 9px}}

/* ---------- generic ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.2}
h2,h3{font-weight:600}
.btn{font-family:var(--display);display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:9px 16px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);filter:none}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 10px;font-weight:400}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:14px;border-radius:8px}
.btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{border-color:var(--line);color:var(--ink);background:var(--surface)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.danger:hover{color:var(--danger)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------- home ---------- */
.home-head{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0 34px;max-width:720px}
.home-head h1{font-size:clamp(32px,4.6vw,50px);font-weight:700;letter-spacing:-.025em}
.home-head .kicker{font-family:var(--display);font-weight:600;font-size:14px;color:var(--accent)}
.home-head p{margin:0;font-size:18px;color:var(--muted);max-width:60ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 26px;margin-bottom:56px}
.folder{position:relative;padding-top:12px}
.folder-body{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:26px 22px 20px;min-height:250px;display:flex;flex-direction:column;gap:12px}
.folder:not(.soon) .folder-body{border-top:4px solid var(--accent)}
.folder-tab{position:absolute;top:0;left:18px;z-index:2;font-family:var(--display);font-size:12px;font-weight:600;background:var(--amber);color:#171717;padding:3px 10px;border-radius:999px}
.folder h2{font-size:24px;font-weight:700}
.folder:not(.soon) h2,.folder:not(.soon) .org{padding-right:84px}
.folder p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.folder .org{color:var(--ink)}
.folder .sheet{position:absolute;right:18px;top:-6px;width:74px;height:96px;background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:0 4px 14px rgba(23,23,23,.08);transform:rotate(4deg);padding:7px 6px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.folder .sheet img{width:100%}
.folder .sheet i{display:block;height:3px;background:#d5d9d9;border-radius:2px}
.folder .sheet i.s{width:60%}
.folder .sheet .c2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.folder-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
.folder.soon .folder-body{background:var(--surface-2);border:1.5px dashed var(--line)}
.folder.soon .folder-tab{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.drafts h2{font-size:24px;margin-bottom:14px}
.draft-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.draft-list li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.draft-list .t{flex:1;min-width:0}
.draft-list .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft-list .t span{font-size:14px;color:var(--muted)}
.empty-note{color:var(--muted);padding:18px 0}

/* ---------- form ---------- */
.form-layout{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:start}
.form-nav{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px}
.form-nav a{display:block;padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none}
.form-nav a:hover{background:var(--surface);color:var(--ink)}
.form-nav .cta{margin-top:18px}
@media (max-width:880px){.form-layout{grid-template-columns:1fr}.form-nav{display:none}}
.form-title{display:flex;flex-wrap:wrap;align-items:end;gap:14px;justify-content:space-between;margin-bottom:24px}
.form-title h1{font-size:34px;font-weight:700}
.form-title p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px;scroll-margin-top:84px}
.panel>h2{font-size:22px;margin-bottom:4px}
.panel>.sub{margin:0 0 18px;color:var(--muted);font-size:15px}
.fixed-panel{background:var(--surface-2);border-style:dashed}
.fixed-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.fixed-grid{grid-template-columns:1fr}}
.fixed-grid img{border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px}
.fixed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.fixed-list li{display:flex;gap:8px;align-items:flex-start}
.fixed-list svg{flex:none;margin-top:3px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0}
.f.w3{grid-column:span 3}.f.w4{grid-column:span 4}.f.w6{grid-column:span 6}.f.w1{grid-column:span 1}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.f,.f.w3,.f.w4,.f.w6{grid-column:span 2}.f.w1{grid-column:span 1}}
.f label,.lbl-sm{font-size:14px;font-weight:700}
.f small{font-size:13px;color:var(--muted)}
.inp,.ta,select.inp{width:100%;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 11px;font-size:16px;line-height:1.4}
.inp:hover,.ta:hover{border-color:var(--muted)}
.inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:84px;display:block}
.title-preview{grid-column:span 6;background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.title-preview .tp{font-family:Arimo,Arial,sans-serif;font-weight:700;flex:1;min-width:220px}
.title-preview input{flex:1;min-width:220px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.inst-list{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.inst-list li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start}
.inst-list .n{padding-top:10px;text-align:right;font-weight:700;color:var(--muted);font-size:14px}
.inst-list .ta{min-height:44px;resize:none;overflow:hidden}
.inst-list .acts{display:flex;padding-top:4px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;margin-bottom:14px;color:var(--muted)}
.tok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--accent-soft);color:var(--ink);padding:2px 7px;border-radius:6px;border:0;cursor:pointer}
.tok:hover{outline:1.5px solid var(--accent)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.sec{border-top:2px solid var(--ink);padding-top:16px;margin-top:18px}
.sec:first-of-type{margin-top:0}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-head .inp{font-family:var(--display);font-weight:700;font-size:20px;max-width:340px;text-transform:uppercase}
.sec-head .range{color:var(--muted);font-size:14px}
.sec-head .sp{flex:1}
.q{border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px;background:var(--surface);scroll-margin-top:84px}
.q-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.q-head b{font-family:Arimo,Arial,sans-serif;font-size:15px}
.q-head .sp{flex:1}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.alt-row{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center}
.alt-row span{font-family:Arimo,Arial,sans-serif;font-weight:700;text-align:right;font-size:15px}
.alt-row .inp{padding:7px 10px;font-size:15px}
.alt-ta{resize:none;overflow:hidden;display:block;min-height:0}
.alt-row span{align-self:start;padding-top:8px}
.q-img{margin-top:10px;display:flex;gap:10px;align-items:flex-start}
.q-img img{max-width:220px;max-height:140px;border:1px solid var(--line);border-radius:6px;background:#fff}
.q .ta{min-height:96px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.empty-q{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);margin-bottom:12px}
.form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.sticky-go{display:none;position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));justify-content:flex-end;pointer-events:none;margin-top:10px}
@media (max-width:880px){.sticky-go{display:flex}}
.sticky-go .btn{pointer-events:auto;box-shadow:0 6px 18px rgba(23,23,23,.16)}

/* ---------- review ---------- */
.review-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 59px)}
@media (max-width:980px){.review-layout{grid-template-columns:1fr}}
.desk{background:var(--desk);padding:28px 20px 60px;overflow-x:auto}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px}
.page-slot{position:relative;flex:none}
.page-slot .page{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 26px rgba(0,0,0,.10)}
.side{border-left:1px solid var(--line);background:var(--surface);padding:22px 20px 40px;display:flex;flex-direction:column;gap:20px}
.side-sticky{position:sticky;top:78px;display:flex;flex-direction:column;gap:20px}
@media (max-width:980px){.side{border-left:0;border-bottom:1px solid var(--line);order:-1}.side-sticky{position:static}}
.side h2{font-size:22px}
.side p{margin:0;font-size:15px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:10px;font-size:15px}
.legend div{display:flex;gap:10px;align-items:center}
.sw{width:34px;height:16px;border-radius:3px;flex:none;border:1px solid var(--line);background:#fff}
.sw.var{background:linear-gradient(transparent 45%, var(--mark) 45%);border-color:transparent}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-size:26px;color:var(--ink);line-height:1.1}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.issues button{width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--amber);padding:4px 8px;cursor:pointer;font-size:14px}
.issues button:hover{background:var(--surface-2)}
.all-good{display:flex;gap:8px;align-items:center;color:var(--ok);font-size:15px;font-weight:700}
.confirm{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.confirm .chk{font-size:15px;align-items:flex-start}
.confirm .chk input{margin-top:2px}
.dl-note{font-size:13px;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,28,.5);display:grid;place-items:center;padding:20px}
.modal-box{background:var(--surface);border-radius:16px;max-width:680px;width:100%;max-height:calc(100vh - 40px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.modal-box h2{font-size:24px}
.modal-box .ta{min-height:220px;font-size:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.drop input{max-width:100%}
.parse-result{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:15px}
.radios{display:flex;gap:18px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:60;max-width:calc(100vw - 32px)}


/* ---------- campos formatados (estilo Word) ---------- */
.rt{min-height:42px;cursor:text;white-space:normal;word-break:break-word;outline:none}
.rt-para{min-height:96px}
.rt:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rt:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 4px;font-weight:700;white-space:nowrap;cursor:default}
.paper .pill{background:#E6F1EF;color:#1F5E58}
.rtbar{position:fixed;z-index:70;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(15,20,40,.16)}
.rtbar button{min-width:34px;height:32px;border:0;border-radius:7px;background:none;cursor:pointer;font-size:16px;color:var(--ink);font-family:Arimo,Arial,sans-serif}
.rtbar button:hover{background:var(--surface-2)}
.rtbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rtbar .sepv{width:1px;background:var(--line);margin:4px 3px}
.rtbar button.clr{font-size:13px;padding:0 8px}
.inst-list li{grid-template-columns:28px minmax(0,1fr) auto}
.inst-list .rt{min-height:42px}
.alt-row{grid-template-columns:30px minmax(0,1fr)}
.alt-row .rt{min-height:38px;padding:7px 10px;font-size:15px}
.alt-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.q-tools{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.nalt{display:flex;flex-direction:column;gap:5px}
.nalt select{width:auto;min-width:190px}
.hdr-prev-wrap{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.hdr-prev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
.hdr-prev .m-full{min-width:704px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:3px;align-self:flex-start}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pastebox{min-height:240px;max-height:46vh;overflow:auto;border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2);font-size:14px;line-height:1.45;outline:none}
.pastebox:focus{border-style:solid;border-color:var(--accent)}
.pastebox:empty::before{content:attr(data-ph);color:var(--muted)}

/* ---------- v3 ---------- */
.panel-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-h .subtle{font-size:13px;color:var(--muted);font-style:italic}
.prof-list{display:flex;flex-direction:column;gap:8px}
.prof-row{display:flex;gap:6px;align-items:center}
.prof-row .inp{flex:1}
.add-line{align-self:flex-start;margin-top:4px;padding-left:0}
.f select + .inp{margin-top:6px}
.sec-tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.sec-tabs button{border:1.5px solid var(--line);border-bottom:0;background:var(--surface-2);border-radius:10px 10px 0 0;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:-2px}
.sec-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--ink);border-bottom:2px solid var(--surface)}
.sec-tabs .cnt{font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:1px 8px}
.sec-tabs .sec-tab-add{background:none;border-style:dashed;font-weight:400}
.sec-tabs + .sec{border-top:0;padding-top:0;margin-top:0}
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.fmt-grid{grid-template-columns:1fr}}
.fmt{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fmt legend{font-weight:700;font-size:14px;margin-bottom:8px;padding:0}
.choice{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.choice .ct{display:flex;flex-direction:column}
.pgc{font-size:13px;color:var(--muted)}
.thumb{width:46px;height:58px;flex:none;overflow:hidden;box-sizing:border-box;background:#fff;border:1px solid #c8ccd4;border-radius:3px;padding:6px;display:grid;gap:4px}
.t-two{grid-template-columns:1fr 1fr}.t-one{grid-template-columns:1fr}
.t-two i,.t-one i{background:repeating-linear-gradient(#b9bfcc 0 2px, transparent 2px 5px)}
.t-grade,.t-bub{width:58px;height:58px;padding:7px 6px;display:grid;grid-template-columns:repeat(5,8px);grid-auto-rows:8px;gap:2px;justify-content:center;align-content:center}
.t-grade i,.t-bub i{display:block;width:8px;height:8px;box-sizing:border-box;border:1px solid #6f7685}
.t-bub i{border-radius:50%}
.t-grade i:nth-child(7),.t-grade i:nth-child(13){background:linear-gradient(45deg,transparent 40%,#171717 40% 60%,transparent 60%),linear-gradient(-45deg,transparent 40%,#171717 40% 60%,transparent 60%)}
.t-bub i:nth-child(7),.t-bub i:nth-child(13){background:#171717}

/* ============ PAPER (o documento em si) ============ */
.paper{font-family:Arimo,Arial,Helvetica,sans-serif;color:#000;-webkit-font-smoothing:antialiased}
.page{width:794px;height:1123px;background:#fff;color:#000;overflow:hidden;padding:26px 45px 46px;font-family:Arimo,Arial,Helvetica,sans-serif}
.page .pn{position:absolute;right:45px;bottom:20px;font-size:10px}
.page .content{height:1051px;display:flex;flex-direction:column}
.cols{display:flex;flex:none}
.col{width:50%;min-width:0}
.col.c0{padding-right:14px}
.col.c1{padding-left:14px;border-left:1px solid #000}
.m-full{width:704px}
.m-col{width:338px}
.blk{font-size:13px;line-height:1.33;text-align:justify;hyphens:none}
.blk p{margin:0}
.b-head img{display:block;width:704px;height:auto}
.b-aluno{display:flex;align-items:flex-end;gap:4px;font-weight:700;font-size:13px;padding:6px 0 10px}
.b-aluno .ln{border-bottom:1px solid #000;height:15px;font-weight:400}
.b-title{text-align:center;font-weight:700;font-size:13.5px;padding:2px 0 8px;line-height:1.3}
.b-insth{font-weight:700;padding:4px 0 6px}
.b-inst{display:flex;font-size:13px;line-height:1.3;padding-bottom:1px}
.b-inst .n{flex:none;width:22px}
.b-inst .tx{flex:1;min-width:0}
.b-gab{padding:14px 0 0}
.gab{border-collapse:collapse;margin:0 auto;table-layout:fixed;font-size:10px}
.gab td,.gab th{border:1px solid #000;text-align:center;padding:0;height:17px}
.gab th{font-weight:700;background:#e6e6e6}
.gab .lt{font-size:12px;font-weight:700;width:26px}
.gab .sg{border-left-width:2px}
.gab .nm{font-size:9.5px}
.b-sech{text-align:center;font-weight:700;padding:0 0 10px}
.b-sech .sn{text-transform:uppercase}
.b-q0{padding-top:12px}
.b-qp{padding-top:7px}
.b-img{padding-top:7px;text-align:center}
.b-img img{display:inline-block}
.b-a0{padding-top:9px}
.b-cont{padding-top:0}
.blk p.cont{text-align-last:justify}
.b-a{padding-top:1px}
.b-alast{padding-bottom:12px}
.col>.blk:first-child{padding-top:0}
.qn{font-weight:700}
.al{font-weight:400}
.ph{color:#9a9a9a;font-style:italic}

/* destaque do que é variável (somente na revisão) */
.reviewing .v{background-image:linear-gradient(transparent 52%, rgba(245,151,2,.30) 52%);border-radius:1px;cursor:text;outline:none;transition:background-color .12s}
.reviewing .v:hover{background-color:rgba(245,151,2,.14)}
.reviewing .v:focus{background-image:none;background-color:#FFF4E2;box-shadow:0 0 0 2px #297971}
.reviewing.nomarks .v{background-image:none}
.reviewing .fx{cursor:not-allowed}
.reviewing .flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background-color:rgba(41,121,113,.22)}100%{background-color:transparent}}


.b-h1{text-align:center;font-weight:700;font-size:13.5px;padding:4px 0 10px}
.b-h2{font-size:13.5px;padding:2px 0 10px}
.b-h3{font-size:13px;padding:2px 0 10px;white-space:nowrap}
.b-center{text-align:center}
.b-row{display:flex;justify-content:space-between;gap:10px}
.opt{margin-right:4px}
.opt .x{display:inline-block;width:15px;text-align:center;font-weight:700}
.bl{display:inline-block;border-bottom:1px solid #000;height:14px;vertical-align:baseline}
.gab td.na{background:#cfcfcf}
.cols.one .col{width:100%;padding:0;border:0}
.bub-row{display:flex;justify-content:center;gap:22px}
.bub-cap{text-align:center;font-weight:700;font-size:10.5px;height:16px}
.bubt{border-collapse:collapse;border:1.5px solid #000}
.bubt td{padding:2px 6px;height:20px;white-space:nowrap}
.bubt tr.z td{background:#e3e3e3}
.bubt .bn{font-weight:700;font-size:10.5px;text-align:center;width:16px}
.bubt .o{display:inline-block;width:15px;height:15px;border:1px solid #000;border-radius:50%;font-size:8.5px;line-height:13px;text-align:center;margin:0 2px;background:#fff;vertical-align:middle}
.bubt .o.off{visibility:hidden}
.reviewing .vv{background-image:linear-gradient(transparent 52%, rgba(245,151,2,.30) 52%)}
.reviewing.nomarks .vv{background-image:none}

#measure{position:absolute;left:-20000px;top:0;visibility:hidden;pointer-events:none}
#exportRoot{position:fixed;left:-20000px;top:0;pointer-events:none}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .page{position:relative;transform:none!important;box-shadow:none;page-break-after:always;break-after:page}
  html,body{background:#fff}
}

const EXEMPLO_HUMANAS = {"sections":[{"name":"HISTÓRIA","questions":[{"alts":["coletivização da produção agrícola para garantir o abastecimento das vilas operárias.","desregulamentação dos contratos de locação das terras pertencentes à Coroa britânica.","transformação de espaços de uso coletivo tradicionais em propriedades privadas comerciáveis.","proteção das pequenas posses camponesas contra o avanço das indústrias têxteis.","abolição dos impostos incidentes sobre a criação de ovelhas voltada à subsistência."],"text":"\"Muitas dessas terras comunais foram apropriadas por grandes proprietários, sobretudo membros da gentry. Isso ocorreu por meio da compra do direito de uso dessas terras ou pela transferência desse direito determinada por leis aprovadas pelo Parlamento britânico, as Enclosure Acts ('Leis dos Cercamentos'). [...] praticamente todo o território tinha se tornado propriedade de indivíduos ou empresas.\" Do ponto de vista jurídico e econômico, a aplicação das Enclosure Acts na Grã-Bretanha representou uma transformação radical na estrutura fundiária, cujo principal efeito foi a:"},{"alts":["intervenção direta do Estado absolutista na fixação de salários operários elevados.","livre iniciativa e a acumulação de capital sem restrições sociais ou institucionais.","proteção do trabalhador urbano por meio de cartas de privilégio corporativas.","estabilização do mercado consumidor interno através do poder de compra operário.","mediação de sindicatos oficiais financiados pelo Parlamento e pela gentry rural."],"text":"\"No final do século XVIII e em boa parte do século XIX, a produção fabril não era regulamentada. Não havia pagamento mínimo, jornada máxima, descanso semanal, férias nem outros direitos trabalhistas. As condições de trabalho eram degradantes. As jornadas eram exaustivas – chegavam a dezoito horas por dia.\" A ausência de legislação trabalhista durante o período inicial da Revolução Industrial, conforme descrita no texto, reflete a hegemonia de um modelo econômico que priorizava a:"},{"alts":["qualificação acadêmica prévia obtida pelas mulheres nas corporações de fiação.","conveniência financeira e facilidade de controle disciplinar sobre esses grupos sociais.","decretos monárquicos que proibiam os homens adultos de exercer atividades fabris urbanas.","isenção tributária concedida às fábricas que mantivessem igualdade salarial interna.","proteção paternalista que visava afastar as mulheres do ambiente insalubre doméstico."],"text":"\"Muitas indústrias britânicas eram compostas por mão de obra feminina. De acordo com dados de 1834, as mulheres representavam aproximadamente 54% dos operários adultos nas indústrias de tecido. [...] Isso pode ser explicado pelo fato de os empresários acreditarem que era mais fácil disciplinar mulheres e crianças. Além disso, mesmo executando os mesmos trabalhos que os homens, as mulheres recebiam salários menores...\" A inserção massiva de mulheres e crianças nas indústrias têxteis do século XIX revela uma faceta de gênero e idade na exploração do trabalho. De acordo com o texto, a preferência do empresariado por essa mão de obra assentava-se em razões de:"},{"alts":["assegurava a competitividade internacional dos tecidos ingleses a longo prazo.","promovia a ascensão social dos jovens aprendizes por meio do esforço laboral manual.","comprometia a reprodução física e a formação básica da futura força de trabalho da nação.","eliminava a necessidade de investimentos públicos em infraestrutura e saneamento urbano.","continha os conflitos de classe ao transferir os salários infantis diretamente para os pais."],"text":"\"Disto resulta: Que as crianças empregadas em todos os ramos de manufatura do Reino trabalham o mesmo número de horas que os adultos; Que os efeitos de trabalho tão prolongado são: a deterioração permanente da constituição física; a aquisição de doenças incuráveis; a exclusão (por excesso de fadiga) dos meios de obtenção da educação adequada...\" (Relatório do Parlamento Britânico, 1833) A publicação do relatório parlamentar de 1833 constitui um marco na história social do trabalho. A leitura institucional do documento demonstra que o Estado britânico passou a reconhecer que o ritmo da industrialização sem amparo legal:"},{"alts":["flexibilização absoluta dos contratos de trabalho para garantir a renda profissional nas periferias.","inserção precoce no mercado produtivo como substituto do ensino formal básico e obrigatório.","proteção integral dos direitos da criança e do adolescente, vinculando o trabalho à formação técnica pedagógica.","estatização das funções fabris destinadas a jovens em situação de vulnerabilidade socioeconômica.","equiparação jurídica imediata entre a capacidade civil do menor de 14 anos e a do operariado adulto"],"text":"\"Atualmente, a legislação brasileira proíbe o trabalho de adolescentes menores de 16 anos, e o trabalho infantil é considerado crime no Brasil. A exceção é para adolescentes a partir de 14 anos contratados como aprendizes. Essa contratação é condicionada a uma série de regras; por exemplo, a função desempenhada deve ter o objetivo de capacitar os jovens, a atividade precisa ser remunerada...\" Ao contrastar a realidade histórica do século XIX com a legislação brasileira contemporânea sobre o menor de idade, observa-se uma mudança filosófica e jurídica fundamental. Essa transformação caracteriza-se pela passagem de um modelo de exploração irrestrita para uma doutrina de:"},{"alts":["mercantilização sustentável, visando a exportação futura de créditos de carbono.","interdependência intrínseca, onde humanidade e meio ambiente se integram de forma indissociável.","dominação técnica planejada, voltada ao extrativismo mineral de baixo impacto social.","privatização coletiva, garantindo o direito de uso exclusivo de insumos agrícolas pela gentry.","linearidade desenvolvimentista, que prioriza a construção de barragens para teares hidráulicos."],"text":"\"A cosmovisão de muitos grupos indígenas brasileiros, por exemplo, difere radicalmente do modo de perceber o mundo das sociedades industriais e prevê sentidos muito diversos para 'a natureza'; em geral, ela não é considerada um recurso passível de apropriação, pois, para esses povos, os seres humanos e a 'natureza' constituem uma entidade única e inseparável.\" O confronto entre a lógica das sociedades industriais e a cosmovisão dos povos originários indígenas, conforme exposto no texto, reside na definição do estatuto ontológico da natureza. Enquanto a matriz industrial a conceitua como objeto comercializável, a perspectiva indígena a define sob a lógica da:"},{"alts":["democratização das rotinas domésticas fora das oficinas.","emancipação financeira da massa assalariada britânica.","exercício do poder patronal e de subordinação da força de trabalho.","qualificação técnica voltada para o uso de teares hidráulicos rápidos.","harmonização dos interesses entre a gentry rural e o operariado urbano."],"text":"\"Ninguém, a não ser o mestre e o filho do mestre, tinha relógio, e nunca sabíamos que horas eram. Havia um homem que tinha relógio [...]. Foi-lhe tirado e entregue à custódia do mestre, porque ele informará aos homens a hora do dia...\" (Edward Thompson) O episódio narrado no texto de Edward Thompson ilustra as tensões acerca do controle do tempo no ambiente de trabalho fabril. A apreensão do relógio do operário pelo mestre demonstra que a medição do tempo era utilizada como um instrumento de:"},{"alts":["controle e a vigilância contínua sobre a temporalidade da força de trabalho.","autogestão absoluta das metas produtivas por parte do operariado assalariado.","isolamento total do trabalhador em relação aos canais de comunicação mundiais.","remuneração baseada na confecção personalizada e artesanal de cada objeto virtual.","dependência das variações climáticas sazonais para a execução de tarefas intelectuais."],"text":"Ao longo da história, a organização do trabalho passou por profundas rupturas técnicas. A Primeira Revolução Industrial fixou o trabalhador às fábricas e aos relógios; a Segunda expandiu as linhas de montagem em série; e a Terceira Revolução Industrial (tecnocientífica), ao introduzir a microeletrônica e a informática na segunda metade do século XX, permitiu a descentralização produtiva que hoje culmina no teletrabalho e na automação digital. Ao analisar o uso contemporâneo de aplicativos de registro virtual de ponto através desse panorama histórico, identifica-se uma clara \"permanência\". Esta permanência diz respeito ao fato de que, mesmo com a flexibilidade espacial contemporânea, persiste o(a):"},{"alts":["dissociação definitiva entre as pesquisas acadêmicas e as necessidades do empresariado têxtil.","fusão orgânica entre o conhecimento científico laboratorial e a escala de produção fabril.","descentralização da malha ferroviária europeia em prol do retorno ao comércio fluvial local.","primazia da gentry agrária britânica sobre os investimentos nas indústrias químicas pesadas.","redução do mercado consumidor internacional devido à adoção generalizada do escambo mineral."],"text":"\"A partir da segunda metade do século XIX, ocorreu uma expansão econômica extraordinária em que o potencial produtivo da industrialização cresceu em um contexto de ampliação dos mercados consumidores. Em parte, essa expansão é tributária de uma série de inovações científicas que passaram a ser sistematicamente aplicadas ao setor produtivo, criando uma interdependência entre o laboratório e a fábrica.\" A configuração da chamada \"Segunda Revolução Industrial\" introduz uma nova dinâmica estrutural no capitalismo, diferenciando-a da primeira fase do processo. Essa nova dinâmica baseou-se na:"},{"alts":["justificar o colonialismo na África como um mecanismo de alívio das tensões internas operárias.","propor modelos alternativos de organização social e econômica capazes de superar as contradições do capitalismo.","acelerar a automação das indústrias siderúrgicas para extinguir completamente o trabalho remunerado.","defender o retorno irrestrito ao absolutismo monárquico e ao sistema de corporações de ofício medievais.","legitimar a ausência de direitos trabalhistas sob o pretexto da liberdade individual de contrato burguês."],"text":"\"Apesar dos esforços, os países ditos modernos e progressistas, intimamente ligados aos avanços da ciência, continuavam a apresentar graves crises sociais, relacionadas, principalmente, às condições de vida e de trabalho dos mais pobres. Por isso, também na segunda metade do século XIX, alguns intelectuais dedicaram-se a pensar em formas, estratégias e mecanismos para reduzir ou eliminar as desigualdades...\" A frequência de graves desigualdades sociais no âmago das nações industrializadas gerou um intenso debate teórico no século XIX. O surgimento dessas novas correntes intelectuais críticas fundamentava-se na necessidade de:"}]},{"name":"GEOGRAFIA","questions":[{"alts":["A expansão da lavoura de cana-de-açúcar na região Nordeste.","A decadência da mineração de ouro e pedras preciosas na região Centro-Oeste.","O acúmulo de capital do café e a consequente concentração industrial na região Sudeste.","A criação de zonas francas de livre comércio na região Norte.","A construção de Brasília."],"text":"Ao longo do século XX, o espaço geográfico brasileiro deixou de ser predominantemente agrário-exportador para se tornar urbano-industrial. Esse processo ganhou forte impulso a partir da década de 1930. Assinale a alternativa que aponta o principal fator econômico e a região que concentrou inicialmente essa transformação espacial:"},{"alts":["Consolidar a economia baseada no comércio marítimo internacional na costa brasileira.","Integrar o interior do país ao território nacional e promover a marcha para o Oeste.","Diminuir o fluxo migratório de trabalhadores nordestinos em direção à Amazônia.","Isolar a capital federal das decisões políticas e das pressões econômicas globais.","Criar uma cidade com uma industrialização moderna"],"text":"Na segunda metade do século XX, o governo de Juscelino Kubitschek (1956-1961) promoveu uma das modificações mais marcantes na organização do território brasileiro: a construção de Brasília. Do ponto de vista da organização espacial do país, o principal objetivo dessa estratégia foi:"},{"alts":["Êxodo rural.","Transumância.","Migração pendular.","Diáspora agrária.","Movimento migratório industrial"],"text":"A partir da década de 1970, o censo demográfico do IBGE registrou um marco histórico na distribuição da população brasileira. O espaço geográfico nacional consolidou-se como predominantemente urbano. Esse fenômeno de migração em massa do campo para as cidades ficou conhecido como:"},{"alts":["Criação de cooperativas de agricultura familiar focadas exclusivamente na subsistência.","Desativação de ferrovias e portos fluviais para proteger a cobertura florestal nativa.","Construção de grandes rodovias pioneiras (como a Transamazônica) e incentivo a projetos de colonização e mineração.","Proibição da entrada de capitais estrangeiros e de grandes empresas agropecuárias na região.","Incentivo a países estrangeiros a explorarem terras improdutivas na Amazônia."],"text":"Durante a ditadura militar (1964-1985), o Estado brasileiro adotou a estratégia de integrar a Amazônia ao restante do país sob o lema \"Integrar para não entregar\". Essa política governamental transformou profundamente o espaço nortista por meio de qual das seguintes ações?"},{"alts":["Incentivos governamentais para a produção exclusiva de subsistência e pequenas hortas comunitárias.","Modernização agrícola, mecanização pesada e expansão da fronteira agrícola para o cultivo de commodities, como a soja.","Substituição completa das terras agrícolas por grandes centros urbanos e indústrias de alta tecnologia.","Declínio das atividades de exportação e retorno total às técnicas tradicionais de cultivo indígena","Incentivo do governo na produção de agroflorestas."],"text":"Nas últimas décadas do século XX, a estrutura agrária do Centro-Oeste brasileiro sofreu uma radical transformação espacial, modificando a paisagem do bioma Cerrado. Esse processo foi impulsionado principalmente por:"},{"alts":["Movimento dos Trabalhadores Sem Teto (MTST).","Movimento dos Atingidos por Barragens (MAB).","Movimento dos Trabalhadores Rurais Sem Terra (MST).","Confederação Nacional dos Trabalhadores na Agricultura(CONTAG).","Movimento da Transição Agroecológica (MTA)."],"text":"A partir da década de 1980, o debate e as ações práticas em torno da reforma agrária no Brasil ganharam novos rumos com o surgimento e a organização de movimentos sociais camponeses. O movimento de maior projeção nacional e internacional nesse cenário, caracterizado pela estratégia de ocupação de latifúndios improdutivos para pressionar o Estado, é o:"},{"alts":["Subsídios para a compra exclusiva de agrotóxicos pesados e sementes modificadas em laboratórios estrangeiros.","Linhas de crédito facilitadas, assistência técnica agrícola permanente, infraestrutura de transporte e acesso a mercados consumidores.","Isenção total de impostos para a venda de produtos agrícolas voltados unicamente para a exportação de grandes commodities.","Mecanização pesada obrigatória com a proibição de técnicas de manejo manual e agricultura familiar.","Contratos de exclusividade que obriguem o assentado a vender toda a sua produção para grandes indústrias multinacionais."],"text":"O sucesso de um assentamento de reforma agrária não depende apenas da distribuição física dos lotes de terra aos trabalhadores. Para que a reforma agrária cumpra seu papel socioeconômico e garanta a permanência do agricultor no campo, o Estado precisa fornecer uma estrutura complementar que inclua, fundamentalmente:"},{"alts":["2, 1, 3","1, 2, 3","3, 1, 2","2, 3, 1","3, 2, 1"],"text":"Sobre as os produtos da agroindústria brasileira, relacione a primeira coluna com a segunda\n\n1. Laranja (   ) Abastece principalmente a forte indústria têxtil nacional e o mercado de vestuário, além de exportar o excedente de fibra em pluma.\n\n2. Algodão (   ) Processada quase em sua totalidade no Sudeste (interior de SP) para a exportação de suco concentrado congelado (FCOJ) para a Europa e Estados Unidos.\n\n3. Celulose (   ) Matéria-prima derivada principalmente de florestas plantadas de eucalipto, destinada à fabricação de papéis, embalagens e exportação de fibra curta.\n\nQual é a sequência correta de associação de cima para baixo?"},{"alts":["I, apenas.","III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"text":"Considere as seguintes proposições a respeito da commodity açúcar e etanol (complexo sucroenergético):\n\nI. O Brasil é o maior produtor global de cana-de-açúcar, e a maior parte da produção nacional está concentrada na região Centro-Sul, especialmente no estado de São Paulo.\n\nII. A produção de etanol de milho tem registrado forte crescimento no Brasil, concentrando-se principalmente na região Centro-Oeste como uma alternativa complementar à cana.\n\nIII. O etanol brasileiro perdeu o status de commodity no mercado internacional porque sua produção é altamente poluente e emite mais carbono que a gasolina fóssil.\n\nEstá correto o que se afirma em:"},{"alts":["Queima de óleo diesel importado nas caldeiras das usinas para acelerar o refino do açúcar.","Utilização do bagaço da cana-de-açúcar para a cogeração de energia elétrica e produção de biogás a partir da vizinhaça.","Deposição do excedente de cana-de-açúcar em aterros sanitários urbanos para a produção de chorume controlado.","Substituição total do plantio de cana-de-açúcar por florestas nativas intocáveis de preservação permanente.","Exportação do bagaço in natura para países vizinhos realizarem o descarte em oceanos."],"text":"O processamento industrial de commodities agrícolas gera grandes volumes de resíduos orgânicos que, se descartados incorretamente, podem causar graves problemas ambientais. Por outro lado, a aplicação dos conceitos de Economia Circular tem permitido que a agroindústria transforme esses passivos em ativos energéticos. Um exemplo clássico e altamente disseminado na agroindústria sucroenergética brasileira é a:"}]},{"name":"SOCIOLOGIA","questions":[{"alts":["Estado e governo possuem exatamente o mesmo significado.","O governo é permanente, enquanto o Estado muda a cada eleição.","O Estado é uma organização permanente, e os governos podem mudar conforme as regras políticas.","O Estado existe apenas em países democráticos.","O governo é formado exclusivamente pelos representantes do Poder Legislativo."],"text":"Em uma aula de Sociologia, a professora explicou que o Estado é uma instituição permanente, enquanto o governo corresponde ao grupo responsável pela administração do país durante determinado período.\n\nCom base nessa explicação, assinale a alternativa correta."},{"alts":["os sistemas eleitorais.","os sistemas de governo.","os partidos políticos.","as formas de Estado.","os direitos políticos."],"text":"Em alguns países, o chefe de Estado e o chefe de governo são pessoas diferentes. Em outros, essas funções são exercidas por uma única pessoa. Essa diferença caracteriza principalmente:"},{"alts":["ao sistema partidário.","à forma de Estado.","ao sistema eleitoral.","ao regime econômico.","ao direito ao voto."],"text":"Observe a situação.\n\nDois países possuem organização territorial distinta. No primeiro, os governos locais possuem autonomia política e administrativa. No segundo, praticamente todas as decisões são tomadas pelo governo central.\n\nEssa diferença está relacionada principalmente:"},{"alts":["sistema presidencialista.","parlamentarismo.","unicameralismo.","bicameralismo.","federalismo."],"text":"O Congresso Nacional brasileiro é formado por duas casas legislativas: Câmara dos Deputados e Senado Federal. Essa característica indica que o Brasil adota:"},{"alts":["substituir o Poder Legislativo.","organizar interesses e representar diferentes propostas políticas perante a sociedade.","fiscalizar exclusivamente o Poder Judiciário.","administrar diretamente os municípios.","elaborar todas as leis do país."],"text":"Leia a situação.\n\nDurante as eleições, um grupo de estudantes discutia a importância dos partidos políticos. Alguns afirmavam que eles servem apenas para lançar candidatos. Outros defenderam que os partidos organizam ideias e representam diferentes projetos para a sociedade.\n\nA respeito das funções dos partidos políticos, assinale a alternativa correta:"},{"alts":["majoritário.","proporcional.","presidencialista.","parlamentarista.","federativo."],"text":"Leia a situação.\n\nEm determinado país, os votos dados aos candidatos são utilizados para definir quantas cadeiras cada partido ocupará no Parlamento. Assim, um partido que recebeu mais votos tende a eleger um número maior de representantes. O texto descreve uma característica do sistema:"},{"alts":["democracia direta.","democracia representativa.","monarquia absoluta.","ditadura.","oligarquia."],"text":"Leia a notícia adaptada.\n\n*Nas eleições, milhões de cidadãos comparecem às urnas para escolher seus representantes. Após eleitos, esses representantes passam a tomar decisões em nome da população.*\n\nA situação apresentada corresponde principalmente ao princípio da:"},{"alts":["fortalecimento dos regimes autoritários.","ampliação da participação popular nas eleições.","crise de representatividade política.","diminuição da cidadania.","substituição da democracia pelo parlamentarismo."],"text":"Leia o texto.\n\n*Pesquisas de opinião mostram que parte da população demonstra desconfiança em relação aos partidos políticos, ao Congresso Nacional e aos representantes eleitos.*\n\nEssa situação pode ser compreendida como um exemplo de:"},{"alts":["somente os governantes participam das decisões públicas.","a população participa apenas durante as campanhas eleitorais.","existem mecanismos que permitem maior participação da sociedade na vida política.","os partidos políticos deixam de existir.","as decisões passam a ser tomadas exclusivamente pelo Poder Judiciário."],"text":"As teorias democráticas contemporâneas destacam que a democracia não deve limitar-se apenas ao momento da votação nas eleições. De acordo com essa perspectiva, uma democracia torna-se mais efetiva quando:"},{"alts":["depende apenas da realização periódica de eleições.","limita a participação popular ao momento do voto.","envolve diferentes formas de participação política e exercício da cidadania.","substitui completamente o trabalho dos representantes eleitos.","elimina a necessidade da existência de partidos políticos."],"text":"Observe a situação.\n\nUm grupo de estudantes organizou um debate para discutir problemas do bairro. Além de votar nas eleições, os participantes decidiram acompanhar as ações dos vereadores, participar de audiências públicas e apresentar propostas para melhorar a comunidade. Essa situação demonstra que a democracia:"}]},{"name":"FILOSOFIA","questions":[{"alts":["É um fenômeno que apenas aproxima culturas sem gerar conflitos","É um processo de integração econômica, cultural e política em escala mundial","Acabou com as desigualdades sociais entre os países","É restrita apenas ao comércio de produtos","Começou apenas com a internet nos anos 2000"],"text":"Sobre a globalização, é correto afirmar:"},{"alts":["O direito de votar apenas se tiver ensino superior","O direito à vida, liberdade e segurança pessoal","O direito de uma nação intervir militarmente em outra","O direito de empresas lucrarem sem pagar impostos","O direito de censurar opiniões contrárias"],"text":"De acordo com a Declaração Universal dos Direitos Humanos de 1948, um direito fundamental é:"},{"alts":["Gosta de assistir noticiário e debates","Só vive em sociedade e para realizar-se plenamente precisa da vida na pólis","Deve obedecer cegamente ao governante","Nasce com instinto de votar em eleições","Precisa competir com outros para sobreviver"],"text":"Para Aristóteles, o homem é um \"animal político\" porque:"},{"alts":["Apenas pagar impostos em dia","Direitos, deveres e participação na vida pública","Morar no próprio país de origem","Ter mais de 18 anos e título de eleitor","Não cometer crimes"],"text":"Cidadania, na concepção moderna, envolve:"},{"alts":["Carisma, tradição e leis racionais/legais","Força bruta e violência","Dinheiro e poder econômico","Dogmas religiosos","Manipulação da mídia"],"text":"Na visão de Max Weber, o poder político legítimo se sustenta principalmente em:"},{"alts":["Maior acesso a outras culturas","Intercâmbio de estudantes","Homogeneização cultural e perda de tradições locais","Valorização das línguas indígenas","Aumento do turismo"],"text":"Um dos impactos negativos da globalização cultural é:"},{"alts":["Não votar para não ter problemas","Participar de audiência pública e fiscalizar vereadores","Ignorar as leis se ninguém estiver vendo","Acreditar que política é só para políticos","Vender o voto por dinheiro"],"text":"Qual alternativa apresenta um exemplo de exercício da cidadania?"},{"alts":["A capacidade de influenciar, determinar ou controlar a ação de outros","Apenas o poder que o presidente da república tem","O mesmo que autoridade moral","Algo que só existe no Estado","A força física de uma pessoa"],"text":"Na Filosofia Política, \"Poder\" pode ser definido como:"},{"alts":["Inexistente, pois são temas separados","A democracia garante que os direitos humanos sejam respeitados e participados","Os direitos humanos só valem em ditaduras","Democracia serve para tirar direitos das pessoas","Direitos humanos impedem o voto"],"text":"A relação entre Direitos Humanos e Democracia é:"},{"alts":["O ser humano pode se desenvolver plenamente vivendo isolado","Sociedade é o conjunto de indivíduos organizados por regras, valores e instituições","Sociedade só existe se tiver um rei","Em sociedade não existem conflitos","Cada pessoa vive sozinha e depois se junta"],"text":"Sobre sociedade, é correto afirmar:"}]}],"professores":"WOLDNEI / JORGE / FABIANA / ROBERTO","area":"HUMANAS"};

const paras = t => { const p = String(t||'').split(/\n[ \t]*\n/).map(x=>x.trim()); return p.length ? p : ['']; };

/* números por extenso (pt-BR) */
const UN = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const DZ = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const CT = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function extenso(n, fem){
  n = Math.floor(n);
  const f = w => fem ? w.replace(/^um$/,'uma').replace(/^dois$/,'duas').replace(/entos$/,'entas') : w;
  if (n < 20) return f(UN[n]);
  if (n < 100){ const d=Math.floor(n/10), u=n%10; return DZ[d] + (u ? ' e ' + f(UN[u]) : ''); }
  if (n === 100) return 'cem';
  if (n < 1000){ const c=Math.floor(n/100), r=n%100; return f(CT[c]) + (r ? ' e ' + extenso(r, fem) : ''); }
  return String(n);
}
function valorFmt(v){
  const n = parseFloat(String(v).replace(',', '.'));
  if (isNaN(n)) return String(v||'');
  const intp = Math.floor(n), dec = Math.round((n - intp)*100);
  const num = (dec % 10 === 0 ? n.toFixed(1) : n.toFixed(2)).replace('.', ',');
  let ex = extenso(intp);
  if (dec === 50) ex += ' e meio';
  else if (dec) ex += ' vírgula ' + extenso(dec % 10 === 0 ? dec/10 : dec);
  return `${num} (${ex})`;
}

/* ===================== texto formatado =====================
   Internamente o texto guarda a formatação com marcas simples:
   **negrito**, *itálico*, ++sublinhado++. O professor nunca vê essas marcas:
   os campos mostram o texto já formatado e os botões N / I / S aplicam o estilo. */
const TOKENS = ['questoes','valor','alternativas','duracao'];
const TOK_TITLE = { questoes:'Número de questões: atualiza sozinho', valor:'Valor da prova: atualiza sozinho', alternativas:'Alternativas por questão', duracao:'Duração da prova' };
function tokVal(t, d){
  if (!d) return '';
  const n = allQuestions(d).length;
  if (t === 'questoes') return `${pad2(n)} (${extenso(n, true)})`;
  if (t === 'valor') return valorFmt(d.f.valor);
  if (t === 'alternativas'){ const k = typeof d.f.nAlt === 'number' ? d.f.nAlt : 5; const l = LETRAS.slice(0,k).split(''); return `${k} (${extenso(k,true)}) alternativas (${l.slice(0,-1).join(', ')} e ${l[l.length-1]})`; }
  if (t === 'duracao') return d.f.duracao || '___';
  return '';
}
function md(s, mode = 'out'){
  let h = esc(s)
    .replace(/\*\*(.+?)\*\*/gs,'<b>$1</b>')
    .replace(/\+\+(.+?)\+\+/gs,'<u>$1</u>')
    .replace(/\*(?!\s)(.+?)\*/gs,'<i>$1</i>')
    .replace(/\n/g,'<br>');
  h = h.replace(/\{(questoes|valor|alternativas|duracao)\}/g, (m, t) => mode === 'edit'
    ? `<span class="pill" contenteditable="false" data-tok="${t}" title="${TOK_TITLE[t]}">${esc(tokVal(t, doc))}</span>`
    : esc(tokVal(t, doc)));
  return h;
}
function normalizeMd(s){
  s = s.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n');
  s = s.replace(/\*\*\*\*/g,'').replace(/\+\+\+\+/g,'');
  return s.split('\n\n').map(p => {
    if ((p.match(/\*\*/g)||[]).length % 2) p = p.replace(/\*\*/g,'');
    if ((p.match(/\+\+/g)||[]).length % 2) p = p.replace(/\+\+/g,'');
    const singles = p.replace(/\*\*/g,'').match(/\*/g);
    if (singles && singles.length % 2) p = p.replace(/(?<!\*)\*(?!\*)/g,'');
    return p.replace(/(\*\*|\+\+|\*)\s+\1/g, ' ').trim();
  }).filter((p,i,a) => p || i < a.length-1).join('\n\n').replace(/\n{3,}/g,'\n\n').trim();
}
const BLOCK_TAGS = /^(P|DIV|LI|H[1-6]|TR|BLOCKQUOTE|UL|OL|TABLE|SECTION|ARTICLE|HEADER|FOOTER)$/;
const SKIP_TAGS = /^(STYLE|SCRIPT|HEAD|META|TITLE|XML|LINK|IMG|SVG|O:P)$/;
function htmlToMd(src){
  let root = src;
  if (typeof src === 'string') root = new DOMParser().parseFromString(src, 'text/html').body;
  let out = '';
  const brk = () => { if (out && !/\n\n$/.test(out)) out = out.replace(/\n?$/, '\n\n'); };
  const walk = (n, st) => {
    if (n.nodeType === 3){ out += n.nodeValue.replace(/[\r\n]+/g,' '); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toUpperCase();
    if (SKIP_TAGS.test(tag)) return;
    if (n.dataset && n.dataset.tok){ out += `{${n.dataset.tok}}`; return; }
    if (tag === 'BR'){ out += '\n'; return; }
    const css = (n.getAttribute('style') || '').toLowerCase();
    const notBold = /font-weight:\s*(normal|[1-4]00)/.test(css);
    const b = !st.b && !notBold && (tag==='B' || tag==='STRONG' || /font-weight:\s*(bold|[6-9]00)/.test(css));
    const i = !st.i && (tag==='I' || tag==='EM' || /font-style:\s*italic/.test(css));
    const u = !st.u && (tag==='U' || /text-decoration[^;]*underline/.test(css));
    const block = BLOCK_TAGS.test(tag) && n !== root;
    if (block) brk();
    out += (b?'**':'') + (i?'*':'') + (u?'++':'');
    const ns = { b: st.b||b, i: st.i||i, u: st.u||u };
    n.childNodes.forEach(c => walk(c, ns));
    out += (u?'++':'') + (i?'*':'') + (b?'**':'');
    if (tag === 'TD' || tag === 'TH') out += ' ';
    if (block) brk();
  };
  walk(root, { b:false, i:false, u:false });
  return normalizeMd(out);
}
const balanced = s => (s.match(/\*\*/g)||[]).length % 2 === 0 && (s.match(/\+\+/g)||[]).length % 2 === 0 && (s.replace(/\*\*/g,'').match(/\*/g)||[]).length % 2 === 0;

function migrate(d){

/* caminhos editáveis na revisão: f.area | f.profs | f.data | inst.i | sec.s.name | q.s.i.p.k | q.s.i.a.k */
function getRaw(path, frag){
  if (frag){ const [x,y] = frag.split(':').map(Number); return getRaw(path).split(' ').slice(x,y).join(' '); }
  const a = path.split('.');
  if (a[0]==='f') return a[1] === 'profs' ? profText(doc) : (doc.f[a[1]] || '');
  if (a[0]==='inst') return doc.inst[+a[1]] ?? '';
  if (a[0]==='sec') return doc.sections[+a[1]]?.name ?? '';
  if (a[0]==='q'){
    const q = doc.sections[+a[1]].questions[+a[2]];
    return a[3]==='p' ? paras(q.text)[+a[4]] ?? '' : (q.alts[+a[4]] ?? '');
  }
  return '';
}
function setRaw(path, v, frag){
  if (frag){ const [x,y] = frag.split(':').map(Number); const w = getRaw(path).split(' '); v = [...w.slice(0,x), v, ...w.slice(y)].join(' '); }
  const a = path.split('.');
  if (a[0]==='f'){ if (a[1] === 'profs') doc.f.profs = splitProfs(v); else doc.f[a[1]] = v.replace(/\n/g,' '); }
  else if (a[0]==='inst'){ if (v.trim()) doc.inst[+a[1]] = v.replace(/\n/g,' '); else doc.inst.splice(+a[1],1); }
  else if (a[0]==='sec') doc.sections[+a[1]].name = v.replace(/\n/g,' ').toUpperCase();
  else if (a[0]==='q'){
    const q = doc.sections[+a[1]].questions[+a[2]];
    if (a[3]==='p'){ const p = paras(q.text); p[+a[4]] = v; q.text = p.filter(x => x.trim()).join('\n\n'); }
    else q.alts[+a[4]] = v.replace(/\n/g,' ');
  }
}
function displayFor(path, raw){
  if (path === 'f.area' || path === 'f.profs' || path.startsWith('sec.')) return esc(raw.toUpperCase());
  if (path === 'f.data') return esc(raw);
  if (!raw.trim()) return '<span class="ph">(vazio)</span>';
  return md(raw);
}

        const isLast = j === k - 1;
        const a = q.alts[j] ?? '';
        body.push({ cls: (j===0?'b-a0':'b-a') + (isLast?' b-alast':''), keep: j===0 && k > 1, html:`<span class="al fx">${LETRAS[j]})</span> ${V(`q.${si}.${qi}.a.${j}`, a.trim()? md(a) : '<span class="ph">(vazio)</span>', 'line')}` });
      }
    });
  });
  return { full, body };
}
function paraHTML(path, raw, pre, frag, cont){
  const attr = frag ? ` data-frag="${frag}"` : '';
  return `<p${cont?' class="cont"':''}>${pre}${V(path, raw.trim() ? md(raw) : '<span class="ph">(enunciado vazio)</span>', 'para', attr)}</p>`;
}

function gabaritoTables(d){ return d.f.gabarito === 'bolhas' ? gabaritoBolhas(d) : gabaritoGrade(d); }
function gabaritoBolhas(d){
  const items = [];
  let n = 0;
  d.sections.forEach(s => s.questions.forEach(q => { n++; items.push({ n, sec: (s.name||'').toUpperCase(), k: nAltOf(q, d) }); }));
  if (!items.length) return [];
  const anyNamed = d.sections.some(s => s.name && s.name.trim() && s.questions.length);
  const maxK = Math.max(...items.map(i => i.k));
  const tables = [];
  for (let i = 0; i < items.length; i += 10){
    const chunk = items.slice(i, i+10);
    const secs = [...new Set(chunk.map(c => c.sec))];
    const cap = anyNamed ? `<div class="bub-cap">${secs.length === 1 ? esc(secs[0]) : '&nbsp;'}</div>` : '';
    tables.push(`<div class="bub">${cap}<table class="bubt">${chunk.map((it, ri) => `<tr${ri % 2 === 0 ? ' class="z"' : ''}><td class="bn">${it.n}</td><td class="bb">${Array.from({length: maxK}, (_, j) => j < it.k ? `<span class="o">${LETRAS[j]}</span>` : `<span class="o off"></span>`).join('')}</td></tr>`).join('')}</table></div>`);
  }
  const per = Math.max(1, Math.floor(704 / (40 + maxK * 21 + 22)));
  const rows = [];
  for (let i = 0; i < tables.length; i += per) rows.push(`<div class="bub-row">${tables.slice(i, i+per).join('')}</div>`);
  return rows;
}
function gabaritoGrade(d){
  const items = [];
  let n = 0;
  d.sections.forEach(s => s.questions.forEach(q => { n++; items.push({ n, sec: (s.name||'').toUpperCase(), k: nAltOf(q, d) }); }));
  if (!items.length) return [];
  const per = items.length <= 10 ? 10 : 20;
  const rows = Math.max(...items.map(i => i.k));
  const tables = [];
  const anyNamed = d.sections.some(s => s.name && s.name.trim() && s.questions.length);
  for (let i = 0; i < items.length; i += per){
    const chunk = items.slice(i, i+per);
    const groups = [];
    chunk.forEach(it => { const g = groups[groups.length-1]; if (g && g.sec === it.sec) g.count++; else groups.push({ sec: it.sec, count:1 }); });
    const starts = new Set(); let acc = 0; groups.forEach((g,gi) => { if (gi) starts.add(acc); acc += g.count; });
    let cw = 32.9;
    if (anyNamed) groups.forEach(g => { cw = Math.max(cw, (g.sec.length * 8 + 14) / g.count); });
    cw = Math.min(cw, 678 / chunk.length);
    let h = `<table class="gab" style="width:${Math.round(26 + chunk.length*cw)}px"><colgroup><col style="width:26px">${chunk.map(()=>'<col>').join('')}</colgroup>`;
    if (anyNamed) h += `<tr><th></th>${groups.map((g,gi)=>`<th colspan="${g.count}" class="${gi?'sg':''}">${esc(g.sec)}</th>`).join('')}</tr>`;
    h += `<tr><th></th>${chunk.map((it,ci)=>`<th class="nm ${starts.has(ci)?'sg':''}">${pad2(it.n)}</th>`).join('')}</tr>`;
    for (let k = 0; k < rows; k++) h += `<tr><td class="lt">${LETRAS[k]}</td>${chunk.map((it,ci)=>`<td class="${starts.has(ci)?'sg':''}${k >= it.k ? ' na' : ''}"></td>`).join('')}</tr>`;
    tables.push(h + '</table>');
  }
  return tables;
}

const CONTENT_H = 1051, MIN_REGION = 260, REGION_GAP = 16;
function measure(blocks, host){
  host.innerHTML = blocks.map(b => `<div class="blk ${b.cls}">${b.html}</div>`).join('');
  const els = host.children;
  return blocks.map((b,i) => els[i].getBoundingClientRect().height);
}
function paginate(d){
  const { full, body } = buildBlocks(d);
  const hf = measure(full, $('#mFull'));
  const ncol = d.f.colunas === 1 ? 1 : 2;
  const bodyHost = ncol === 1 ? $('#mFull') : $('#mCol');
  const hb = measure(body, bodyHost);
  $('#mFull').innerHTML = ''; $('#mCol').innerHTML = '';
  const pages = [];
  let page = { full:[], cols:null }, used = 0;
  pages.push(page);
  full.forEach((b,i) => {
    if (used + hf[i] > CONTENT_H && page.full.length){ page = { full:[], cols:null }; pages.push(page); used = 0; }
    page.full.push(b); used += hf[i];
  });
  if (!body.length) return pages;
  let colH = CONTENT_H - used - REGION_GAP;
  // as questões sempre começam numa folha nova, depois do cabeçalho, instruções e gabarito
  if (page.full.length){ page = { full:[], cols:null }; pages.push(page); colH = CONTENT_H; }
  page.cols = Array.from({length:ncol}, () => []); page.colH = colH; page.gap = page.full.length ? REGION_GAP : 0;
  let ci = 0, cu = 0;
  const mcol = bodyHost;
  const measureOne = (cls, html) => { mcol.innerHTML = `<div class="blk ${cls}">${html}</div>`; const h = mcol.firstChild.getBoundingClientRect().height; mcol.innerHTML = ''; return h; };
  const nextCol = () => {
    ci++; cu = 0;
    if (ci >= ncol){ page = { full:[], cols: Array.from({length:ncol}, () => []), colH: CONTENT_H, gap:0 }; pages.push(page); ci = 0; }
  };
  const MIN_LINES = 64;
  const queue = body.map((b,i) => ({ ...b, h: hb[i] }));
  for (let i = 0; i < queue.length; i++){
    const b = queue[i];
    const room = () => page.colH - cu;
    if (b.para){
      if (b.h <= room()){ page.cols[ci].push(b); cu += b.h; continue; }
      if (cu > 0 && room() < MIN_LINES){ nextCol(); i--; continue; }
      const words = b.para.raw.split(' ');
      const off = b.para.off || 0;
      const avail = room();
      let lo = 1, hi = words.length - 1, best = 0;
      while (lo <= hi){
        const mid = (lo + hi) >> 1;
        const part = words.slice(0, mid).join(' ');
        const h = measureOne(b.cls, paraHTML(b.para.path, part, b.para.pre, `${off}:${off+mid}`, true));
        if (h <= avail){ best = mid; lo = mid + 1; } else hi = mid - 1;
      }
      while (best > 0 && !balanced(words.slice(0,best).join(' '))) best--;
      if (best < 6){ if (cu > 0){ nextCol(); i--; continue; } page.cols[ci].push(b); cu += b.h; continue; }
      const head = words.slice(0,best).join(' '), tail = words.slice(best).join(' ');
      page.cols[ci].push({ cls:b.cls, q:b.q, html: paraHTML(b.para.path, head, b.para.pre, `${off}:${off+best}`, true) });
      nextCol();
      const tpara = { path:b.para.path, raw:tail, pre:'', off: off+best };
      const thtml = paraHTML(b.para.path, tail, '', `${off+best}:${off+words.length}`, false);
      queue.splice(i+1, 0, { cls:'b-cont', keep:b.keep, q:b.q, para:tpara, html:thtml, h: measureOne('b-cont', thtml) });
      continue;
    }
    let need = b.h;
    if (b.keep && queue[i+1]){
      const nx = queue[i+1];
      need += nx.para ? Math.min(nx.h, MIN_LINES) : nx.h;
    }
    if (cu > 0 && cu + need > page.colH) nextCol();
    page.cols[ci].push(b); cu += b.h;
  }
  return pages;
}
function pagesHTML(pages){
  return pages.map((p, pi) => {
    let h = `<div class="page" data-page="${pi+1}"><div class="content">`;
    h += p.full.map(b => `<div class="blk ${b.cls}">${b.html}</div>`).join('');
    if (p.cols){
      h += `<div class="cols${p.cols.length === 1 ? ' one' : ''}" style="height:${p.colH}px;margin-top:${p.gap||0}px">` +
        p.cols.map((c,ci) => `<div class="col c${ci}">${c.map(b => `<div class="blk ${b.cls}"${b.q?` data-q="${b.q}"`:''}>${b.html}</div>`).join('')}</div>`).join('') + '</div>';
    }
    return h + `</div><div class="pn fx">${pi+1}</div></div>`;
  }).join('');
}

/* ===================== leitura de questões coladas ou importadas ===================== */
const plainOf = s => s.replace(/\*\*|\+\+|\*/g,'');
function afterPrefix(orig, plainLen){
  let i = 0, c = 0;
  while (i < orig.length && c < plainLen){
    if (orig.startsWith('**', i) || orig.startsWith('++', i)){ i += 2; continue; }
    if (orig[i] === '*'){ i++; continue; }
    i++; c++;
  }
  return orig.slice(i);
}
function parseQuestoes(raw) {
  const out = { sections: [], professores: null, area: null };
  let lines = raw.replace(/\r/g,'').replace(/\u00a0/g,' ').split('\n').map(l => l.replace(/\t/g,' ').replace(/ {2,}/g,' ').trim());
  const M = '(?:\\*\\*|\\+\\+|\\*)*';
  const splitAlt = new RegExp(`\\s(?=${M}[B-H]\\)\\s)|(?<=[.;!?])(?=${M}[B-H]\\)\\s)`);
  const expanded = [];
  for (const l of lines){
    if (/^[A-Ha-h]\)\s/.test(plainOf(l))) l.split(splitAlt).forEach(p => expanded.push(p.trim()));
    else expanded.push(l);
  }
  lines = expanded;
  let pending = null, sec = null, q = null, mode = null;
  const isHeader = l => {
    if (l.length < 4 || l.length > 40 || /\d/.test(l) || /[:().,;?!"“”]/.test(l)) return false;
    if (/^QUEST/i.test(l)) return false;
    const letters = l.replace(/[^A-Za-zÀ-ÿ]/g, '');
    return letters.length >= 4 && letters === letters.toUpperCase() && l.split(/\s+/).length <= 4;
  };
  const pushStem = txt => {
    const ps = q.paras, last = ps[ps.length-1];
    if (last !== undefined && !/[.:?!"”)\]]$/.test(plainOf(last)) && /^[a-zà-ÿ]/.test(plainOf(txt))) ps[ps.length-1] = last + ' ' + txt;
    else ps.push(txt);
  };
  for (const l of lines){
    if (!l) continue;
    const pl = plainOf(l).trim();
    if (!pl) continue;
    let m;
    if (!q && (m = pl.match(/^PROFESSOR(?:ES|A|\(A\)|\(ES\))?\s*:\s*(.+)$/i))){ if (!/^_+$/.test(m[1].trim())) out.professores = m[1].trim(); continue; }
    if (!q && (m = pl.match(/^AVALIA[ÇC][ÃA]O\s+DE\s+([A-ZÀ-Ý ]+?)(?:\s+[–-]|$)/))){ out.area = m[1].trim(); continue; }
    if ((m = pl.match(/^(QUEST[ÃA]O\s*(\d+)\s*[.\-:)–]*\s*)(.*)$/i))){
      if (!sec || (pending && pending !== sec.name)){ sec = { name: pending || '', questions: [] }; out.sections.push(sec); }
      q = { paras: [], alts: [] }; sec.questions.push(q); mode = 'stem';
      const rest = afterPrefix(l, m[1].length).trim();
      if (plainOf(rest).trim()) pushStem(rest);
      continue;
    }
    if (/^QUEST[ÕO]ES\s+\d+/i.test(pl)) continue;
    if (/^\d{1,3}$/.test(pl)) continue;
    if (isHeader(pl)){ pending = pl; if (q){ q = null; mode = null; } continue; }
    if (!q) continue;
    if ((m = pl.match(/^([A-Ha-h]\)\s*)/))){ q.alts.push(afterPrefix(l, m[1].length).trim()); mode = 'alt'; continue; }
    if (mode === 'alt') q.alts[q.alts.length-1] += ' ' + l;
    else pushStem(l);
  }
  for (const s of out.sections) for (const qq of s.questions){
    qq.text = normalizeMd(qq.paras.join('\n\n')); delete qq.paras;
    qq.alts = qq.alts.map(a => normalizeMd(a));
  }
  return out;
}

/* ===================== barra de formatação (N / I / S) ===================== */
const rtbar = $('#rtbar');
let rtTarget = null;
function placeBar(el){
  const r = el.getBoundingClientRect();
  if (r.bottom < 60 || r.top > innerHeight){ rtbar.classList.add('hide'); return; }
  rtbar.classList.remove('hide');
  const bw = rtbar.offsetWidth, bh = rtbar.offsetHeight;
  let top = r.top - bh - 6;
  if (top < 64) top = r.bottom + 6;
  const left = Math.max(8, Math.min(r.left, innerWidth - bw - 8));
  rtbar.style.top = top + 'px'; rtbar.style.left = left + 'px';
}
function syncBarState(){
  if (!rtTarget) return;
  ['bold','italic','underline'].forEach(c => {
    let on = false; try { on = document.queryCommandState(c); } catch(e){}
    rtbar.querySelector(`[data-cmd="${c}"]`).setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-rich]');
  if (el){ rtTarget = el; placeBar(el); syncBarState(); }
});
document.addEventListener('focusout', e => {
  const el = e.target.closest && e.target.closest('[data-rich]');
  if (el) setTimeout(() => { const a = document.activeElement; if (!a || !a.closest || !a.closest('[data-rich]')){ rtTarget = null; rtbar.classList.add('hide'); } }, 0);
});
['mousedown','pointerdown'].forEach(ev => rtbar.addEventListener(ev, e => e.preventDefault()));
rtbar.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !rtTarget) return;
  document.execCommand(b.dataset.cmd, false, null);
  rtTarget.dispatchEvent(new Event('input', { bubbles:true }));
  syncBarState();
});
document.addEventListener('selectionchange', syncBarState);
window.addEventListener('scroll', () => { if (rtTarget) placeBar(rtTarget); }, true);
window.addEventListener('resize', () => { if (rtTarget) placeBar(rtTarget); });

/* colar em campo formatado: mantém negrito/itálico/sublinhado e descarta o resto */
function richPaste(e, kind){
  e.preventDefault();
  const cd = e.clipboardData || window.clipboardData;
  if (kind === 'plain'){ document.execCommand('insertText', false, cd.getData('text/plain').replace(/\s*\n\s*/g,' ')); return; }
  const html = cd.getData('text/html');
  let t = html ? htmlToMd(html) : normalizeMd(cd.getData('text/plain').replace(/\r/g,''));
  if (kind === 'line') t = t.replace(/\s*\n+\s*/g, ' ');
  document.execCommand('insertHTML', false, md(t));
}

let pcT = null;

      const el = $('#pg'+c); if (!el) return;

}

function renderQ(si, qi, num){

function setBind(path, v){
  const a = path.split('.');
  if (a[0]==='f'){ if (a[1] === 'profs') doc.f.profs[+a[2]] = v; else doc.f[a[1]] = v; return; }
  if (a[0]==='inst'){ doc.inst[+a[1]] = v; return; }
  if (a[0]==='sec'){ doc.sections[+a[1]].name = v; return; }
  if (a[0]==='q'){ const q = doc.sections[+a[1]].questions[+a[2]]; if (a[3]==='text') q.text = v; else q.alts[+a[4]] = v; }
}
function onFormInput(e){
  const el = e.target.closest ? e.target.closest('[data-bind]') : e.target;
  if (!el || !el.dataset.bind) return;
  if (el.classList.contains('rt')){
    let v = htmlToMd(el);
    if (el.dataset.kind !== 'para') v = v.replace(/\s*\n+\s*/g,' ');
    setBind(el.dataset.bind, v);
  } else setBind(el.dataset.bind, el.value);
  touch();
  if (el.dataset.bind.startsWith('f.')) updateHeaderPreview();
  schedulePageCount();
}
function onFormChange(e){
  const el = e.target;
  if (el.dataset.choice){
    const k = el.dataset.choice;
    doc.f.custom = doc.f.custom || {};
    if (el.value === '__custom'){ doc.f.custom[k] = true; doc.f[k] = ''; touch(); keepScroll(renderForm); $(`#i-${k}-c`)?.focus(); return; }
    const was = doc.f.custom[k]; doc.f.custom[k] = false; doc.f[k] = el.value; touch();
    if (was) keepScroll(renderForm); else updateHeaderPreview();
    return;
  }
  if (el.name === 'colunas'){ doc.f.colunas = +el.value; touch(); return; }
  if (el.name === 'gabarito'){ doc.f.gabarito = el.value; touch(); schedulePageCount(50); return; }
  if (el.dataset.actChange === 'nalt'){
    const prev = doc.f.nAlt;
    const v = el.value === 'custom' ? 'custom' : +el.value;
    if (v === 'custom' && prev !== 'custom') allQuestions(doc).forEach(q => { q.n = prev; });
    doc.f.nAlt = v;
    allQuestions(doc).forEach(q => { const k = nAltOf(q); while (q.alts.length < k) q.alts.push(''); });
    touch(); keepScroll(renderForm); return;
  }
  if (el.dataset.bind && el.tagName === 'SELECT'){ setBind(el.dataset.bind, el.value); touch(); updateHeaderPreview(); }
  if (el.dataset.bind && el.dataset.bind.startsWith('sec.')) rerenderSecs();
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function rerenderSecs(){ $('#secs').innerHTML = renderSections(); schedulePageCount(); }
function onFormClick(e){
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, si = +b.dataset.si, qi = +b.dataset.qi, i = +b.dataset.i;
  const qs = doc.sections[si]?.questions;
  const swap = (arr, a, c) => { [arr[a], arr[c]] = [arr[c], arr[a]]; };
  switch (act){
    case 'review': setView('review'); return;
    case 'prof-add': doc.f.profs.push(''); touch(); keepScroll(renderForm); $$('.prof-row .inp').at(-1)?.focus(); return;
    case 'prof-del': doc.f.profs.splice(i,1); if (!doc.f.profs.length) doc.f.profs = ['']; touch(); keepScroll(renderForm); return;
    case 'sec-tab': activeSec = si; keepScroll(rerenderSecs); return;
    case 'import': openImport('file'); return;
    case 'paste': openImport('paste'); return;
    case 'inst-add': doc.inst.push(''); touch(); keepScroll(renderForm); $$('.inst-list .rt').at(-1)?.focus(); return;
    case 'inst-del': doc.inst.splice(i,1); break;
    case 'inst-up': swap(doc.inst, i, i-1); break;

    case 'inst-reset': if (!confirm('Substituir as instruções atuais pelas instruções do modelo?')) return; doc.inst = INSTRUCOES_MODELO.slice(); break;
    case 'sec-add': doc.sections.push({ id:uid(), name:'', questions:[novaQuestao(isCustom(doc) ? 5 : doc.f.nAlt)] }); activeSec = doc.sections.length - 1; touch(); keepScroll(rerenderSecs); $('.sec-head .inp')?.focus(); return;
    case 'sec-del': if (doc.sections[si].questions.some(q => q.text.trim()) && !confirm('Remover a disciplina e todas as questões dela?')) return; doc.sections.splice(si,1); if (!doc.sections.length) doc.sections.push({ id:uid(), name:'', questions:[] }); activeSec = Math.max(0, Math.min(si, doc.sections.length-1) - (si > 0 ? 1 : 0)); touch(); keepScroll(rerenderSecs); return;
    case 'sec-up': swap(doc.sections, si, si-1); activeSec = si-1; touch(); keepScroll(rerenderSecs); return;
    case 'sec-down': swap(doc.sections, si, si+1); activeSec = si+1; touch(); keepScroll(rerenderSecs); return;
    case 'q-add': qs.push(novaQuestao(isCustom(doc) ? 5 : doc.f.nAlt)); touch(); rerenderSecs(); $(`#fq-${si}-${qs.length-1} .rt`)?.focus(); return;

    case 'q-up': swap(qs, qi, qi-1); touch(); rerenderSecs(); $(`#fq-${si}-${qi-1}`)?.scrollIntoView({block:'nearest'}); return;
    case 'q-down': swap(qs, qi, qi+1); touch(); rerenderSecs(); $(`#fq-${si}-${qi+1}`)?.scrollIntoView({block:'nearest'}); return;
    case 'q-img': pickImage(si, qi); return;
    case 'q-img-del': qs[qi].img = null; touch(); rerenderSecs(); return;
    case 'alt-add': { const q = qs[qi]; q.n = Math.min(8, nAltOf(q) + 1); while (q.alts.length < q.n) q.alts.push(''); touch(); keepScroll(rerenderSecs); $(`#fq-${si}-${qi} .alt-row:last-child .rt`)?.focus(); return; }
    case 'alt-rem': { const q = qs[qi]; const k = nAltOf(q); if ((q.alts[k-1]||'').trim() && !confirm(`Remover a alternativa ${LETRAS[k-1]}?`)) return; q.n = Math.max(2, k - 1); q.alts = q.alts.slice(0, q.n); touch(); keepScroll(rerenderSecs); return; }
    default: return;
  }
  touch(); keepScroll(renderForm);
}
function pickImage(si, qi){
  const inp = $('#imgInput');
  inp.value = '';

    };
    r.readAsDataURL(file);
  };
